const FEYN_LIBS="arrows.meta,calc,decorations,decorations.markings,decorations.pathmorphing,decorations.pathreplacing,graphs,patterns,positioning,shapes.geometric";

/* ================= gerenciador geral de pacotes LaTeX ================= */
const PKG_DEF_RE=/\\(newcommand|renewcommand|providecommand|DeclareRobustCommand|DeclareMathOperator|newenvironment|renewenvironment|def|let)(?![A-Za-z])(\*?)/g;
const PKG_BAD_RE=/@|\\(if[a-z]*|fi|else|expandafter|csname|endcsname|edef|xdef|gdef|global|futurelet|afterassignment|catcode|PackageError|PackageWarning|RequirePackage|usepackage|pgf[a-zA-Z]*|tikz[a-zA-Z]*|begingroup|endgroup|relax|noexpand|protected|long|outer)(?![A-Za-z])/;
function pkgStripComments(s){return s.split('\n').map(l=>{let o='';for(let i=0;i<l.length;i++){if(l[i]==='\\'){o+=l[i]+(l[i+1]||'');i++;continue}if(l[i]==='%')break;o+=l[i]}return o}).join('\n')}
function extractMath(code){
  const src=pkgStripComments(String(code||''));let i=0,out=[],ok=0,skip=0;const reqs=new Set();
  const ws=()=>{while(i<src.length&&/\s/.test(src[i]))i++};
  const group=()=>{ws();if(src[i]==='{'){let d=0,s=i;for(;i<src.length;i++){const c=src[i];if(c==='\\'){i++;continue}if(c==='{')d++;else if(c==='}'){d--;if(!d){i++;return src.slice(s+1,i-1)}}}return null}
    if(src[i]==='\\'){const m=/^\\([A-Za-z]+|.)/.exec(src.slice(i));if(!m)return null;i+=m[0].length;return m[0]}return null};
  const opt=()=>{ws();if(src[i]!=='[')return null;let d=0,s=i;for(;i<src.length;i++){const c=src[i];if(c==='{')d++;else if(c==='}')d--;else if(c===']'&&!d){i++;return src.slice(s+1,i-1)}}return null};
  src.replace(/\\(?:RequirePackage|usepackage)\s*(?:\[[^\]]*\])?\s*\{([^}]*)\}/g,(m,l)=>{l.split(',').forEach(n=>reqs.add(n.trim()))});
  PKG_DEF_RE.lastIndex=0;let m;
  while((m=PKG_DEF_RE.exec(src))){
    i=m.index+m[0].length;const k=m[1],star=m[2];let line=null,name='';
    try{
      if(k==='def'){const n=group();const ps=i;while(i<src.length&&src[i]!=='{')i++;const params=src.slice(ps,i).trim();const body=group();name=n||'';
        if(n&&body!=null&&/^(#\d)*$/.test(params.replace(/\s/g,'')))line='\\newcommand{'+n+'}'+(params?'['+(params.match(/#/g)||[]).length+']':'')+'{'+body+'}';}
      else if(k==='let'){const a=group();ws();if(src[i]==='=')i++;const b=group();name=a||'';if(a&&b)line='\\let'+a+b}
      else if(k==='DeclareMathOperator'){const n=group(),body=group();name=n||'';if(n&&body!=null)line='\\DeclareMathOperator'+star+'{'+n+'}{'+body+'}'}
      else if(/environment/.test(k)){const n=group(),na=opt(),df=opt(),b=group(),e=group();name=n||'';if(n&&b!=null&&e!=null)line='\\newenvironment{'+n+'}'+(na?'['+na+']':'')+(df!=null?'['+df+']':'')+'{'+b+'}{'+e+'}'}
      else{const n=group(),na=opt(),df=opt(),body=group();name=n||'';if(n&&body!=null)line='\\newcommand{'+n+'}'+(na?'['+na+']':'')+(df!=null?'['+df+']':'')+'{'+body+'}'}
    }catch(er){line=null}
    PKG_DEF_RE.lastIndex=Math.max(i,m.index+1);
    if(line&&!PKG_BAD_RE.test(line)&&!/@/.test(name)){out.push(line);ok++}else skip++;
  }
  return{code:out.join('\n'),ok:ok,skip:skip,reqs:Array.from(reqs).filter(Boolean)};
}
function pkgPrepare(p){const r=extractMath(p.code);p.mathCode=r.code;p.mathN=r.ok;p.skipN=r.skip;p.reqs=r.reqs;return p}
function cleanPkgCode(t){return String(t).replace(/^\s*\\ProvidesPackage.*$/mg,'').replace(/^\s*\\NeedsTeXFormat.*$/mg,'').replace(/^\s*\\endinput\s*$/mg,'')}
function pkgIdFrom(name){return String(name||'pacote').replace(/\.(sty|tex)$/i,'').replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'')||'pacote'}
async function readPkgFiles(files){
  const map={};for(const f of files)map[f.name.replace(/\.(sty|tex)$/i,'')]=await f.text();
  const names=Object.keys(map);if(!names.length)return null;
  const main=names.find(n=>!names.some(o=>o!==n&&new RegExp('\\\\(input|include|RequirePackage)\\s*\\{'+n.replace(/[-.]/g,'\\$&')+'(\\.sty|\\.tex)?\\}').test(map[o])))||names[0];
  const seen=new Set();const res=(n)=>{if(seen.has(n))return '';seen.add(n);return cleanPkgCode(map[n]).replace(/\\(?:input|include|RequirePackage)\s*\{([^}]+)\}/g,(mm,x)=>{const k=x.replace(/\.(sty|tex)$/i,'');return map[k]!=null?res(k):mm})};
  return{name:main,code:res(main)};
}
function pkgUrl(u){u=u.trim();const g=/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/.exec(u);return g?'https://raw.githubusercontent.com/'+g[1]+'/'+g[2]+'/'+g[3]:u}
function addPkg(name,code,opt){
  opt=opt||{};const id=pkgIdFrom(name);let p=deck.texPkgs.find(x=>x.id===id);
  if(!p){p={id:id,name:String(name).replace(/\.(sty|tex)$/i,''),libs:'',code:'',math:true,tikzAll:false};deck.texPkgs.push(p)}
  p.code=cleanPkgCode(code);if(opt.libs!=null)p.libs=opt.libs;pkgPrepare(p);
  const auto=(p.reqs||[]).filter(r=>TEXPKG[r]&&!deck.packages.includes(r));auto.forEach(r=>deck.packages.push(r));
  return{p:p,auto:auto};
}
function pkgAfterChange(){applyPreamble().then(()=>rerenderAll());commit();if(!side.hidden)renderSide()}
function pkgRowHTML(p){
  return '<div class="pkrow" data-pid="'+esc(p.id)+'"><div class="pkhead"><code>'+esc(p.name)+'</code><span class="hint">'+(p.mathN||0)+' comando(s) para equações'+(p.skipN?' · '+p.skipN+' só no TikZ/Beamer':'')+'</span></div>'+
    '<div class="pkopts"><label class="chk"><input type="checkbox" data-pk="math"'+(p.math?' checked':'')+'> Equações e textos</label>'+
    '<label class="chk"><input type="checkbox" data-pk="tikzAll"'+(p.tikzAll?' checked':'')+'> Todos os diagramas TikZ</label>'+
    '<span style="flex:1"></span><button type="button" class="btn small" data-pk="view">Ver</button><button type="button" class="btn small danger" data-pk="del">Remover</button></div></div>';
}
function pkgModal(){
  const list=()=>deck.texPkgs.length?deck.texPkgs.map(pkgRowHTML).join(''):'<p class="hint">Nenhum pacote importado ainda.</p>';
  openModal('Pacotes LaTeX',
    '<h4 class="pksec">Extensões prontas para equações</h4><div class="pkgrid">'+Object.keys(TEXPKG).map(k=>'<label class="chk" title="'+esc(TEXPKG[k][1])+'"><input type="checkbox" data-bi="'+k+'"'+(deck.packages.includes(k)?' checked':'')+'> <code>'+k+'</code></label>').join('')+'</div>'+
    '<h4 class="pksec">Pacotes importados</h4><div id="pkList">'+list()+'</div>'+
    '<h4 class="pksec">Importar pacote</h4>'+
    '<div class="row"><label class="lab">Nome<input id="pkName" placeholder="ex.: meuspacotes, braket, siunitx-lite"></label><label class="lab">Bibliotecas TikZ (opcional)<input id="pkLibs" placeholder="arrows.meta, calc"></label></div>'+
    '<label class="lab">Código (.sty ou definições)<textarea id="pkCode" class="mono" rows="7" spellcheck="false" placeholder="\\newcommand{\\ket}[1]{\\left|#1\\right\\rangle}\n\\DeclareMathOperator{\\Tr}{Tr}"></textarea></label>'+
    '<div class="row"><label class="lab">ou endereço (URL) de um .sty<input id="pkUrl" placeholder="https://raw.githubusercontent.com/…/pacote.sty"></label><button type="button" class="btn" id="pkFetch" style="flex:none;align-self:end">Baixar</button></div>'+
    '<div class="btns"><label class="btn">Abrir arquivo(s) .sty/.tex<input type="file" id="pkFile" accept=".sty,.tex,text/plain" multiple hidden></label><span style="flex:1"></span><button type="button" class="btn primary" id="pkAdd">Importar</button></div>'+
    '<p class="hint">As equações (MathJax) usam as definições compatíveis: <code>\\newcommand</code>, <code>\\def</code>, <code>\\DeclareMathOperator</code>, <code>\\newenvironment</code>, <code>\\let</code>. Código interno (com <code>@</code>, condicionais, pgf) vale nos diagramas TikZ e na exportação Beamer. Pacotes chamados por <code>\\RequirePackage</code> que existem como extensão pronta são ativados sozinhos.</p>',
    {wide:true,mount:b=>{
      const rl=()=>{b.querySelector('#pkList').innerHTML=list()};
      b.querySelectorAll('[data-bi]').forEach(c=>c.onchange=()=>{const k=c.dataset.bi;deck.packages=deck.packages.filter(x=>x!==k);if(c.checked)deck.packages.push(k);pkgAfterChange()});
      b.querySelector('#pkList').addEventListener('click',ev=>{const t=ev.target.closest('[data-pk]'),row=ev.target.closest('[data-pid]');if(!t||!row)return;const p=deck.texPkgs.find(x=>x.id===row.dataset.pid);if(!p)return;
        if(t.dataset.pk==='del'){deck.texPkgs=deck.texPkgs.filter(x=>x!==p);deck.slides.forEach(s=>s.els.forEach(e=>{if(e.pkgs)e.pkgs=e.pkgs.filter(x=>x!==p.id)}));pkgAfterChange();rl();toast('Pacote '+p.name+' removido.')}
        else if(t.dataset.pk==='view'){b.querySelector('#pkName').value=p.name;b.querySelector('#pkLibs').value=p.libs||'';b.querySelector('#pkCode').value=p.code;b.querySelector('#pkCode').focus()}});
      b.querySelector('#pkList').addEventListener('change',ev=>{const t=ev.target,row=t.closest('[data-pid]');if(!row)return;const p=deck.texPkgs.find(x=>x.id===row.dataset.pid);if(!p)return;p[t.dataset.pk]=t.checked;pkgAfterChange();
        if(t.dataset.pk==='tikzAll')toast(t.checked?'Recompile os diagramas para usar '+p.name+'.':'Pacote desligado nos diagramas.')});
      b.querySelector('#pkFile').onchange=async ev=>{const r=await readPkgFiles(Array.from(ev.target.files||[]));if(!r)return;b.querySelector('#pkName').value=r.name;b.querySelector('#pkCode').value=r.code;toast('Arquivo carregado. Confira e clique em Importar.')};
      b.querySelector('#pkFetch').onclick=async()=>{const u=b.querySelector('#pkUrl').value;if(!u.trim())return;
        try{const r=await fetch(pkgUrl(u));if(!r.ok)throw new Error('HTTP '+r.status);b.querySelector('#pkCode').value=await r.text();if(!b.querySelector('#pkName').value)b.querySelector('#pkName').value=pkgIdFrom(u.split('/').pop());toast('Baixado. Confira e clique em Importar.')}
        catch(er){toast(standalone?'Não consegui baixar ('+er.message+'). O servidor precisa permitir acesso (CORS); links raw.githubusercontent.com e cdn.jsdelivr.net funcionam.':'Aqui no Claude o navegador bloqueia downloads externos. Use a versão publicada ou cole o código.')}};
      b.querySelector('#pkAdd').onclick=()=>{const name=b.querySelector('#pkName').value.trim(),code=b.querySelector('#pkCode').value;
        if(!name||!code.trim()){toast('Dê um nome e cole o código (ou abra um arquivo).');return}
        const r=addPkg(name,code,{libs:b.querySelector('#pkLibs').value.trim()});pkgAfterChange();rl();b.querySelectorAll('[data-bi]').forEach(c=>c.checked=deck.packages.includes(c.dataset.bi));
        b.querySelector('#pkCode').value='';b.querySelector('#pkName').value='';b.querySelector('#pkLibs').value='';
        toast('Pacote '+r.p.name+' importado: '+r.p.mathN+' comando(s) para equações'+(r.auto.length?'; ativei '+r.auto.join(', '):'')+'.')};
    }});
}

/* ================= arquivo .lousa no computador =================
   Com o Lousa TeX instalado como aplicativo (Chrome ou Edge), um duplo clique num arquivo .lousa abre
   a apresentação direto no programa. Quando o navegador oferece acesso a arquivos (File System Access),
   Ctrl+S grava no mesmo arquivo e as mudanças seguintes são salvas nele automaticamente. */
const FS={handle:null,deckId:null,name:'',canWrite:false,busy:null};
const LOUSA_EXT='.lousa';
const fsApi=()=>standalone&&window.isSecureContext&&'showSaveFilePicker' in window&&'showOpenFilePicker' in window;
const LOUSA_TYPES=[{description:'Apresentação do Lousa TeX',accept:{'application/json':['.lousa','.json'],'text/html':['.html']}}];
const HTML_TYPES=[{description:'Apresentação do Lousa TeX (abre no navegador)',accept:{'text/html':['.html']}}];
const SITE_URL=()=>{const b=document.baseURI||location.href;return /^https?:/.test(b)?b.split(/[?#]/)[0].replace(/[^/]*$/,''):'https://mh-pedro.github.io/lousa-tex/'};
/* arquivo .lousa.html: abre no navegador com duplo clique, em qualquer sistema, e carrega o Lousa TeX com a apresentação */
function deckFileHtml(){
  const site=SITE_URL(),title=esc(deck.title||'Apresentação');
  const json=JSON.stringify(deck).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<meta name="generator" content="Lousa TeX">\n<title>'+title+' · Lousa TeX</title>\n</head>\n<body style="margin:0;display:grid;place-items:center;height:100vh;font:16px system-ui,sans-serif;color:#333;background:#f1f3f4">\n'+
  '<div id="lousa-msg" style="max-width:520px;text-align:center;padding:24px"><p style="font-size:22px;margin:0 0 8px"><b>'+title+'</b></p><p>Abrindo no Lousa TeX…</p></div>\n'+
  '<script type="application/json" id="lousa-deck">'+json+'<\/script>\n'+
  '<script>\n(function(){\n  var SITE='+JSON.stringify(site)+';\n  var deck=JSON.parse(document.getElementById("lousa-deck").textContent);\n'+
  '  fetch(SITE+"index.html",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(h){\n'+
  '    window.__LOUSA_DECK=deck;\n    h=h.replace("<head>","<head>\\n<base href=\\""+SITE+"\\">\\n<script>window.__LOUSA_FROM_FILE=true<\\/script>");\n'+
  '    document.open();document.write(h);document.close();\n'+
  '  }).catch(function(e){document.getElementById("lousa-msg").innerHTML="<p><b>Não consegui carregar o Lousa TeX.</b></p><p>Verifique a conexão com a internet e abra o arquivo de novo. Se preferir, acesse <a href=\\""+SITE+"\\">"+SITE+"</a> e use Arquivo › Abrir arquivo do computador.</p>"});\n})();\n<\/script>\n</body>\n</html>\n';
}
const fileLinked=()=>!!(FS.handle&&FS.deckId===deck.id);
function fileStatus(){if(FS.fromFile&&!FS.handle){setSaveState('Aberto de '+FS.name);return}if(fileLinked())setSaveState((FS.canWrite?'Salvo em ':'Aberto de ')+FS.name)}
async function filePerm(h,ask){
  try{const o={mode:'readwrite'};if(await h.queryPermission(o)==='granted')return true;return ask?(await h.requestPermission(o))==='granted':false}catch(e){return false}
}
async function openFromHandle(h){
  try{const f=await h.getFile();const d=parseDeckText(await f.text());
    if(!d){toast('Não reconheci '+f.name+' como uma apresentação do Lousa TeX.');return}
    if(!d.id)d.id=uid();openDeck(d,'Arquivo '+f.name+' aberto.');
    FS.handle=h;FS.deckId=deck.id;FS.name=f.name;FS.canWrite=await filePerm(h,false);fileStatus();
  }catch(e){toast('Não consegui abrir o arquivo: '+(e.message||e))}
}
async function writeFile(h){
  const data=/\.html?$/i.test(h.name||'')?deckFileHtml():JSON.stringify(deck);const w=await h.createWritable();await w.write(data);await w.close();
}
async function saveToFile(saveAs){
  if(editId)exitEdit();commitSoon.flush();
  const nm=(FS.fromFile&&FS.name)||slug(deck.title)+'.lousa.html';
  if(!fsApi()){saveFile(nm,deckFileHtml(),'text/html');return}
  let h=!saveAs&&fileLinked()?FS.handle:null;
  if(!h){try{h=await window.showSaveFilePicker({suggestedName:nm,types:HTML_TYPES})}catch(e){return}}
  if(!await filePerm(h,true)){toast('Sem permissão para gravar nesse arquivo. Use Arquivo › Salvar como…');return}
  try{await writeFile(h);FS.handle=h;FS.deckId=deck.id;FS.name=h.name;FS.canWrite=true;fileStatus();FS.fromFile=false;toast('Salvo em '+h.name+'. As próximas mudanças vão direto para esse arquivo; um duplo clique nele abre a apresentação.')}
  catch(e){toast('Não consegui gravar: '+(e.message||e))}
}
const fileSaveSoon=debounce(()=>{
  if(!fileLinked()||!FS.canWrite)return;
  FS.busy=(FS.busy||Promise.resolve()).then(()=>writeFile(FS.handle)).then(fileStatus).catch(()=>{FS.canWrite=false;setSaveState('Não salvo no arquivo');toast('Não consegui gravar em '+FS.name+'. Use Ctrl+S para tentar de novo.')});
},1500);
async function openFileSmart(){
  if(!fsApi()){openFilePicker('open');return}
  let hs;try{hs=await window.showOpenFilePicker({types:LOUSA_TYPES,multiple:false})}catch(e){return}
  if(hs&&hs[0])openFromHandle(hs[0]);
}
/* abrir pelo sistema (duplo clique no arquivo, com o app instalado) */
function setupLaunchQueue(){
  if(!('launchQueue' in window))return;
  window.launchQueue.setConsumer(p=>{if(p&&p.files&&p.files.length)openFromHandle(p.files[0])});
}
/* instalar como aplicativo */
let installEvt=null;
window.addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();installEvt=ev});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Lousa TeX instalado. Agora os arquivos .lousa abrem com duplo clique.')});
const isInstalled=()=>window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches);
function installApp(){
  if(installEvt){const e=installEvt;installEvt=null;e.prompt();return}
  openModal('Instalar o Lousa TeX',
    (isInstalled()?'<p class="hint">O Lousa TeX já está aberto como aplicativo.</p>':'')+
    '<p class="hint">Instalado, o Lousa TeX ganha janela própria e ícone, e os arquivos <code>.lousa</code> passam a abrir com duplo clique.</p>'+
    '<ol class="hint"><li><b>Chrome ou Edge no computador:</b> clique no ícone de instalar na barra de endereço (um monitor com seta) ou no menu ⋮ › <i>Transmitir, salvar e compartilhar</i> › <i>Instalar página como app</i>.</li>'+
    '<li>Depois, clique com o botão direito num arquivo <code>.lousa</code> › <i>Abrir com</i> › <b>Lousa TeX</b>, e marque para usar sempre.</li></ol>'+
    '<p class="hint">Firefox e Safari não permitem abrir arquivos com duplo clique em apps da web. Neles, use Arquivo › Abrir arquivo do computador.</p>'+
    (location.protocol==='file:'?'<p class="hint err">Este arquivo foi aberto do computador. A instalação só funciona pelo site publicado.</p>':''));
}
/* service worker: permite instalar e abrir mesmo com a conexão instável */
if(standalone&&'serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

/* ================= keyboard ================= */
document.addEventListener('keydown',ev=>{
  if(P.on){if(P.presenter&&ev.target.closest&&ev.target.closest('select'))return;presKey(ev);return}
  if(!modal.hidden){if(ev.key==='Escape')closeModal();return}
  if(!pop.hidden&&ev.key==='Escape'){ev.preventDefault();closePop();return}
  const k=ev.key,lk=k.toLowerCase(),mod=ev.ctrlKey||ev.metaKey,alt=ev.altKey;
  const inEdit=!!(editId&&ev.target.closest&&ev.target.closest('.tx[contenteditable]'));
  const typing=!inEdit&&isTyping(ev.target);
  /* global */
  if(k==='F5'||(mod&&k==='Enter'&&!inEdit)){ev.preventDefault();startPres(ev.shiftKey?0:cur);return}
  if(mod&&alt&&lk==='p'){ev.preventDefault();startPres(cur,true);return}
  if(alt&&(k==='/'||ev.code==='Slash')&&!mod){ev.preventDefault();cmdPalette();return}
  if(mod&&(k==='/'||ev.code==='Slash')){ev.preventDefault();openSide('keys');return}
  if(mod&&lk==='s'){ev.preventDefault();commitSoon.flush();saveSoon.flush();if(driveIdOf()&&driveOn()){driveSave().then(()=>toast('Salvo no Google Drive.')).catch(driveErr)}else if(standalone)saveToFile(ev.shiftKey);else toast('Salvo automaticamente neste navegador.');return}
  if(mod&&lk==='o'){ev.preventDefault();libraryModal();return}
  if(mod&&lk==='p'&&!alt){ev.preventDefault();if(standalone)printModal();else toast('Imprimir e PDF estão disponíveis na versão local.');return}
  if(mod&&alt&&ev.shiftKey&&lk==='h'){ev.preventDefault();versionsModal();return}
  if(mod&&(lk==='h'||(lk==='f'&&!typing))){ev.preventDefault();openSide('find',true);return}
  if(mod&&alt&&lk==='m'){ev.preventDefault();startComment();return}
  if(mod&&ev.shiftKey&&lk==='m'){ev.preventDefault();inlineMath();return}
  if(mod&&!alt&&lk==='k'&&!typing){ev.preventDefault();linkPop(toolbar);return}
  if(mod&&(k==='='||k==='+')){ev.preventDefault();setZoom(clamp(+(scale*1.2).toFixed(3),.1,4));return}
  if(mod&&(k==='-'||k==='_')&&!typing){ev.preventDefault();setZoom(clamp(+(scale/1.2).toFixed(3),.1,4));return}
  if(mod&&!alt&&(k==='0'||ev.code==='Digit0')&&!inEdit){ev.preventDefault();setZoom('fit');return}
  if(mod&&alt&&k==='1'){ev.preventDefault();toggleGridView();return}
  if(mod&&lk==='m'&&!typing&&!alt){ev.preventDefault();addSlide();return}
  if(gridView&&k==='Escape'){toggleGridView(false);return}
  const textish=inEdit||(!typing&&textEls().length>0);
  if(textish&&mod){
    if(ev.shiftKey&&(k==='>'||k==='.'||k==='<'||k===',')){ev.preventDefault();stepSize(k==='>'||k==='.'?1:-1);return}
    if(!ev.shiftKey&&k==='.'){ev.preventDefault();textCmd('superscript');return}
    if(!ev.shiftKey&&k===','){ev.preventDefault();textCmd('subscript');return}
    if(k==='\\'){ev.preventDefault();clearFormat();return}
    if(k===']'){ev.preventDefault();indent(1);return}if(k==='['){ev.preventDefault();indent(-1);return}
    if(ev.shiftKey&&['l','e','r','j'].includes(lk)){ev.preventDefault();alignText({l:'left',e:'center',r:'right',j:'justify'}[lk]);return}
    if(ev.shiftKey&&(k==='7'||k==='&')){ev.preventDefault();textCmd('insertOrderedList');return}
    if(ev.shiftKey&&(k==='8'||k==='*')){ev.preventDefault();textCmd('insertUnorderedList');return}
  }
  if(alt&&ev.shiftKey&&k==='5'&&textish){ev.preventDefault();textCmd('strikeThrough');return}
  if(inEdit){
    if(k==='Escape'){ev.preventDefault();const id=editId;exitEdit();if(byId(id))select([id]);return}
    if(k==='Tab'){ev.preventDefault();const e=editEl();if(e&&e.type==='table'){moveCell(ev.shiftKey?-1:1);return}if(inList())exec(ev.shiftKey?'outdent':'indent');return}
    if(mod&&(lk==='b'||lk==='i'||lk==='u')){ev.preventDefault();exec({b:'bold',i:'italic',u:'underline'}[lk]);return}
    return;
  }
  if(typing){if(k==='Escape')ev.target.blur();return}
  if(mod&&lk==='z'){ev.preventDefault();if(ev.shiftKey)redo();else undo();return}
  if(mod&&lk==='y'){ev.preventDefault();redo();return}
  if(mod&&alt&&lk==='c'){ev.preventDefault();startPainter();return}
  if(mod&&alt&&lk==='v'){ev.preventDefault();if(painter&&selEls()[0])applyPainter(selEls()[0]);return}
  if(mod&&lk==='g'){ev.preventDefault();if(ev.shiftKey)ungroupSel();else groupSel();return}
  if((ev.shiftKey&&k==='F10')||k==='ContextMenu'){ev.preventDefault();const e0=selEls()[0],d=(e0&&elDom(e0))||frame,r=d.getBoundingClientRect();stageContext({clientX:r.left+Math.min(r.width/2,40),clientY:r.top+Math.min(r.height/2,30),target:d,preventDefault(){}});return}
  if(ev.target.closest&&ev.target.closest('#thumbs')){
    if(k==='Delete'||k==='Backspace'){ev.preventDefault();delSlides();focusThumb()}
    else if((k==='ArrowDown'||k==='ArrowRight')&&mod){ev.preventDefault();moveSlides('down');focusThumb()}
    else if((k==='ArrowUp'||k==='ArrowLeft')&&mod){ev.preventDefault();moveSlides('up');focusThumb()}
    else if(k==='ArrowDown'||k==='ArrowRight'){ev.preventDefault();goto(cur+1);focusThumb()}
    else if(k==='ArrowUp'||k==='ArrowLeft'){ev.preventDefault();goto(cur-1);focusThumb()}
    else if(mod&&lk==='d'){ev.preventDefault();dupSlides();focusThumb()}
    else if(mod&&lk==='a'){ev.preventDefault();deck.slides.forEach(s=>slideSel.add(s.id));markThumbs()}
    return;
  }
  if(k==='Escape'){if(painter){stopPainter();return}if(cropId){exitCrop();return}if(tool){setTool(null);return}if(cellSel&&tbl()){cellSel=null;markCells();renderToolbar();return}if(selIds.length){select([]);return}return}
  if(mod&&lk==='a'){ev.preventDefault();select(slide().els.map(e=>e.id));return}
  const els=selEls();
  if(k==='Tab'&&!mod&&!alt){const L=slide().els;if(!L.length)return;ev.preventDefault();const i=L.findIndex(e=>e.id===selIds[selIds.length-1]);
    const n=i<0?(ev.shiftKey?L.length-1:0):(i+(ev.shiftKey?-1:1)+L.length)%L.length;select(groupMembers(L[n].id));return}
  if(cropId&&k==='Enter'){ev.preventDefault();exitCrop();return}
  if(els.length){
    if(k==='Delete'||k==='Backspace'){ev.preventDefault();const e=tbl();if(e&&cellSel&&selIds.length===1){selectedCells(e).forEach(([r,c])=>{e.cells[r][c].html=''});refreshEl(e);commit();return}removeEls(selIds.slice());return}
    if(mod&&lk==='d'){ev.preventDefault();duplicateSel();return}
    if(alt&&!mod&&(k==='ArrowLeft'||k==='ArrowRight')){ev.preventDefault();rotateSel((k==='ArrowRight'?1:-1)*(ev.shiftKey?1:15));return}
    if(mod&&alt&&'kjbwiq'.includes(lk)&&lk){ev.preventDefault();const f=ev.shiftKey?1.01:1.1,m={k:[f,f],j:[1/f,1/f],b:[f,1],w:[1/f,1],i:[1,f],q:[1,1/f]}[lk];scaleSel(m[0],m[1]);return}
    if(mod&&(k==='ArrowUp'||k==='ArrowDown')){ev.preventDefault();order(k==='ArrowUp'?(ev.shiftKey?'front':'forward'):(ev.shiftKey?'back':'backward'));return}
    if(mod&&(lk==='b'||lk==='i'||lk==='u')){ev.preventDefault();textCmd({b:'bold',i:'italic',u:'underline'}[lk]);return}
    if(k.indexOf('Arrow')===0){ev.preventDefault();const st=ev.shiftKey?10:1;nudge(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,k==='ArrowUp'?-st:k==='ArrowDown'?st:0);return}
    const one=els.length===1?els[0]:null;
    if(k==='Enter'&&one){ev.preventDefault();if(one.type==='box')enterEdit(one,'end');else if(one.type==='table')enterEdit(one,'end',cellSel?{r:Math.min(cellSel.r0,cellSel.r1),c:Math.min(cellSel.c0,cellSel.c1)}:null);else if(one.type==='image')enterCrop(one);return}
    if(one&&(one.type==='box'||one.type==='table')&&!one.locked&&k.length===1&&!mod&&!alt){ev.preventDefault();
      if(one.type==='table'){const c=cellSel?{r:Math.min(cellSel.r0,cellSel.r1),c:Math.min(cellSel.c0,cellSel.c1)}:firstVisibleCell(one);enterEdit(one,'end',c)}else enterEdit(one,'end');
      document.execCommand('insertText',false,k);afterEditChange();return}
  }else{
    if(mod&&lk==='d'){ev.preventDefault();dupSlides();return}
    if(mod&&(k==='ArrowUp'||k==='ArrowDown')){ev.preventDefault();moveSlides(k==='ArrowUp'?'up':'down');return}
    if(k==='Home'){ev.preventDefault();goto(0);return}if(k==='End'){ev.preventDefault();goto(deck.slides.length-1);return}
    if(k==='ArrowDown'||k==='PageDown'){ev.preventDefault();goto(cur+1)}else if(k==='ArrowUp'||k==='PageUp'){ev.preventDefault();goto(cur-1)}
  }
});
function focusThumb(){const t=thumbsEl.children[cur];if(t)t.focus()}

/* ================= start ================= */
function initialDeck(){
  if(window.__LOUSA_DECK&&Array.isArray(window.__LOUSA_DECK.slides)){const d=window.__LOUSA_DECK;window.__LOUSA_DECK=null;if(!d.id)d.id=uid();return d}
  const id=lsGet(KEY_CUR);if(id){const d=loadDeckById(id);if(d&&Array.isArray(d.slides)&&d.slides.length)return d}
  const l=libList();if(l[0]){const d=loadDeckById(l[0].id);if(d)return d}
  for(const k of [KEY_OLD2,KEY_OLD1]){try{const s=lsGet(k);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.slides)&&d.slides.length)return d}}catch(e){}}
  return sampleDeck();
}
deck=normalize(initialDeck());setSizeGlobals();titleIn.value=deck.title;
slideSel.add(deck.slides[0].id);resetHistory();
updateTikzFonts();applyPrefsUI();applyPreamble();renderStage();rebuildThumbs();renderToolbar();updateCommentCount();
saveDeckNow();addVersion('',false);
window.mathReady.then(()=>{if(window.__mjFailed)toast('O MathJax não carregou. Verifique a conexão; o LaTeX aparece como texto.')});
driveBoot();
planSig=planSignature();
setupLaunchQueue();
if(window.__LOUSA_FROM_FILE){FS.fromFile=true;FS.deckId=deck.id;FS.name=decodeURIComponent(location.pathname.split('/').pop()||'');setSaveState('Aberto de '+FS.name);toast('Apresentação aberta do arquivo. Ctrl+S salva de volta nele.')}

})();
</script>
