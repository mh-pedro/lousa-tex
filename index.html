<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lousa TeX</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b25c1c">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: title + menu bar, contextual toolbar, then filmstrip | stage (rulers) over speaker notes | optional side panel */
:root{
  --bg:#e8ebe7; --panel:#f8f9f6; --raise:#ffffff; --bar:#eef1ec; --hover:#e2e7e0; --ink:#1b211e; --muted:#5a655f; --line:#d3d8d0;
  --accent:#b25c1c; --accent-ink:#ffffff; --sel:#2a6dd4; --sel-soft:rgba(42,109,212,.12); --sel-ink:#1d4f9c; --danger:#b42318; --guide:#0f9fb5; --note:#f4b400;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --brand:'STIX Two Text','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#131715; --panel:#1a1f1c; --raise:#232a26; --bar:#212824; --hover:#2c3430; --ink:#e5eae6; --muted:#97a29b; --line:#323b36;
  --accent:#e29b52; --accent-ink:#1b130b; --sel:#70a3ff; --sel-soft:rgba(112,163,255,.16); --sel-ink:#a9c7ff; --danger:#ff8f85; --guide:#3fd0e6; --note:#f6c445; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --panel:#1a1f1c; --raise:#232a26; --bar:#212824; --hover:#2c3430; --ink:#e5eae6; --muted:#97a29b; --line:#323b36;
  --accent:#e29b52; --accent-ink:#1b130b; --sel:#70a3ff; --sel-soft:rgba(112,163,255,.16); --sel-ink:#a9c7ff; --danger:#ff8f85; --guide:#3fd0e6; --note:#f6c445; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
#top{background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.titlebar{display:flex;align-items:center;gap:10px;padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.mark{width:38px;height:38px;flex:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px/1 var(--brand);letter-spacing:-.02em}
.mark span span{display:inline-block;vertical-align:-.22em;margin:0 -.1em 0 -.13em}
.titlecol{display:grid;min-width:0;flex:1}
#deckTitle{font:500 17px var(--ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 6px;width:min(440px,100%);min-width:0}
#deckTitle:hover{border-color:var(--line)}#deckTitle:focus{background:var(--raise);border-color:var(--sel);outline:none}
#menubar{display:flex;overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
#menubar button{border:0;background:none;padding:3px 8px;border-radius:5px;font:13px var(--ui);cursor:pointer;white-space:nowrap;flex:none}
#menubar button:hover,#menubar button.on{background:var(--hover)}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
.hbtn{height:36px;min-width:36px;border:1px solid var(--line);border-radius:18px;background:var(--raise);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;font:500 12px var(--ui);flex:none;font-variant-numeric:tabular-nums}
.hbtn:hover{border-color:var(--muted)}
.hbtn svg{width:18px;height:18px}
.playgrp{display:flex;flex:none}
.pbtn{height:36px;border:0;background:var(--accent);color:var(--accent-ink);font:600 13px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:18px 0 0 18px}
.pbtn.chev{padding:0 10px 0 8px;border-radius:0 18px 18px 0;border-left:1px solid rgba(255,255,255,.3)}
.pbtn:hover{filter:brightness(1.07)}
.pbtn svg{width:15px;height:15px}
#toolbar{display:flex;align-items:center;gap:1px;margin-block:8px;margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px));padding:3px 6px;background:var(--bar);border-radius:12px;overflow-x:auto;scrollbar-width:thin;min-height:40px}
.tbtn{height:32px;min-width:32px;padding:0 6px;border:0;border-radius:6px;background:transparent;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font:500 13px var(--ui);flex:none;position:relative;white-space:nowrap}
.tbtn.row{flex-direction:row;gap:4px;padding:0 8px;align-items:center;flex-wrap:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--sel-soft);color:var(--sel-ink)}
.tbtn:disabled{opacity:.35;cursor:default;background:transparent}
.tbtn svg{width:18px;height:18px;flex:none}
.tbtn .mini-chev{width:10px;height:10px;margin-left:-2px}
.tbtn .gl{font:700 15px/1 var(--brand);width:18px;text-align:center}
.tbtn .cbar{width:16px;height:3px;border-radius:1px;margin-top:-1px}
.tbtn .cbar.none{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 4px)!important}
.tsep{width:1px;height:22px;background:var(--line);margin:0 5px;flex:none}
.tsize{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;height:28px;flex:none;background:var(--raise)}
.tsize button{border:0;background:none;width:24px;height:26px;cursor:pointer;font:600 14px var(--ui)}
.tsize button:hover{background:var(--hover)}
.tsize input{width:38px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;padding:0;height:26px;font:13px var(--ui);background:transparent;font-variant-numeric:tabular-nums}

#main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-height:0}
#rail{width:196px;background:var(--panel);border-right:1px solid var(--line);min-height:0;min-width:0;display:flex;flex-direction:column}
#thumbs{--tw:150px;flex:1;overflow:auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:12px}
.thumb{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font:500 11px var(--ui);flex:none;position:relative}
.thumb .num{width:16px;text-align:right;padding-top:1px;font-variant-numeric:tabular-nums;display:grid;gap:4px;justify-items:end}
.thumb .num svg{width:12px;height:12px}
.tframe{width:var(--tw);height:calc(var(--tw) * var(--ar,.5625));position:relative;overflow:hidden;border-radius:4px;outline:1px solid var(--line);flex:none}
.thumb:hover .tframe{outline-color:var(--muted)}
.thumb.msel .tframe{outline:2.5px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.thumb.active .tframe{outline:2.5px solid var(--accent)}
.thumb.active .num{color:var(--accent);font-weight:700}
.thumb.skipped .tframe .slide{opacity:.35}
.tframe .slide{transform:scale(var(--ts));pointer-events:none}
.thumb.drop-before::before,.thumb.drop-after::after{content:"";position:absolute;left:22px;right:0;height:3px;background:var(--sel);border-radius:2px}
.thumb.drop-before::before{top:-8px}.thumb.drop-after::after{bottom:-8px}

#center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
#stageArea{position:relative;min-width:0;min-height:0}
#stageWrap{position:absolute;inset:0;overflow:auto;user-select:none;-webkit-user-select:none;isolation:isolate;scrollbar-width:thin}
#stageArea.rulers #stageWrap{top:20px;left:20px}
#stageWrap.zoomed{overflow:auto}
#stageWrap.drawing,#stageWrap.drawing .el{cursor:crosshair!important}
#stageWrap.painting,#stageWrap.painting .el{cursor:copy!important}
#stageInner{min-width:100%;min-height:100%;width:max-content;height:max-content;display:flex;align-items:center;justify-content:center;padding:28px}
#frame{position:relative;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 30px rgba(0,0,0,.14)}
#overlay{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:5}
.ruler{position:absolute;display:none;background:var(--panel);z-index:3}
#stageArea.rulers .ruler{display:block}
#rulerH{top:0;left:20px;width:calc(100% - 20px);height:20px;border-bottom:1px solid var(--line);cursor:row-resize}
#rulerV{top:20px;left:0;width:20px;height:calc(100% - 20px);border-right:1px solid var(--line);cursor:col-resize}
#rulerC{top:0;left:0;width:20px;height:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#masterBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--panel);padding:5px 6px 5px 14px;border-radius:999px;display:flex;gap:12px;align-items:center;font:500 13px var(--ui);box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;max-width:calc(100% - 24px)}
#masterBar span{overflow:hidden;text-overflow:ellipsis}
#masterBar button{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 12px var(--ui);padding:5px 12px;cursor:pointer}
#gridView{position:absolute;inset:0;overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,240px);justify-content:center;gap:22px;align-content:start;background:var(--bg);z-index:7}
.gtile{--tw:240px;background:none;border:0;padding:0;cursor:pointer;display:grid;gap:6px;justify-items:start;color:var(--muted);font:500 12px var(--ui)}
.gtile .tframe{--ts:var(--tsg)}
.gtile.active .tframe{outline:2.5px solid var(--accent)}
#notesBar{background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:stretch}
#notes{display:block;flex:1;width:100%;border:0;background:transparent;color:var(--ink);resize:vertical;min-height:64px;height:84px;max-height:40vh;padding:10px 12px 10px max(16px,env(safe-area-inset-left,0px));font:14px/1.5 var(--ui)}
#notes:focus{outline:none;background:var(--raise)}
#notes:disabled{opacity:.5}
#dictBtn{align-self:flex-start;margin:8px max(12px,env(safe-area-inset-right,0px)) 0 0;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--raise);cursor:pointer;display:grid;place-items:center}
#dictBtn.on{background:var(--danger);color:#fff;border-color:transparent}
#dictBtn svg{width:16px;height:16px}

/* slide content */
.slide{position:absolute;left:0;top:0;overflow:hidden;line-height:1.25;transform-origin:0 0;text-rendering:optimizeLegibility;background-position:center;background-repeat:no-repeat}
.el{position:absolute}
.el.box{display:flex;flex-direction:column}
.el .shp{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.el .tx{position:relative;overflow-wrap:break-word;outline:none;flex:none;min-height:1em;--ps:0em}
.tx>div{margin-bottom:var(--ps)}
.tx ul,.tx ol{margin:0;padding-left:1.15em}
.tx ul ul,.tx ol ol,.tx ul ol,.tx ol ul{padding-left:1.1em}
.tx li{margin:.16em 0 calc(.16em + var(--ps))}
.tx li::marker{color:var(--mk-c,var(--accent));font-size:var(--mk-s,1em)}
.tx a{color:var(--accent);text-decoration:underline}
.slide mjx-container[jax="SVG"][display="true"]{margin:.3em 0!important}
.el.image .iw{position:absolute;inset:0;overflow:hidden}
.el.image .iw img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none;max-width:none}
.el.image .ghost{position:absolute;opacity:.32;pointer-events:none;display:none;max-width:none}
.el.line{pointer-events:none}
.el.line>svg,.el.chart>svg,.el.ink>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.el.table .tb{width:100%;border-collapse:collapse;table-layout:fixed}
.el.table td{position:relative;overflow-wrap:break-word}
.el.table td .tx{min-height:1.1em}
.el.media .media-ph{position:absolute;inset:0;background:#141716 center/cover no-repeat;display:grid;place-items:center;color:#fff;border-radius:4px;overflow:hidden}
.media-ph .play{width:22%;max-width:96px;min-width:36px;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.media-ph .play svg{width:42%;height:42%}
.media-ph .cap{position:absolute;left:12px;right:12px;bottom:10px;font:500 16px var(--ui);text-shadow:0 1px 3px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el.media video,.el.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.el.media audio{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%}
.el.media .medialink{position:absolute;inset:0;display:grid;place-items:center;background:#141716;color:#fff;font:500 18px var(--ui);text-decoration:underline}
.slnum{position:absolute;right:34px;bottom:20px;font-size:16px;font-variant-numeric:tabular-nums}

/* editor-only decoration */
#frame .el{cursor:move;touch-action:none}
#frame .el.mst{pointer-events:none}
#frame .el.line{cursor:default}
#frame .el.line .hit{cursor:move}
#frame .el.locked,#frame .el.locked .hit{cursor:default}
#frame .el:not(.line):not(.sel):not(.editing):not(.mst):hover{outline:calc(1px * var(--inv)) solid color-mix(in srgb,var(--sel) 55%,transparent)}
#frame .el.sel:not(.line){outline:calc(1.5px * var(--inv)) solid var(--sel)}
#frame .el.sel.locked:not(.line){outline-style:dashed}
#frame .el.editing{outline:calc(1.5px * var(--inv)) solid var(--sel);cursor:default}
#frame .el.editing .tx[contenteditable]{cursor:text;user-select:text;-webkit-user-select:text}
#frame .el .tx.ph::before{content:attr(data-ph);opacity:.42;pointer-events:none}
#frame .el.box.newempty{outline:calc(1px * var(--inv)) dashed var(--muted)}
#frame .el.image.cropping{outline:calc(1.5px * var(--inv)) dashed var(--sel)!important}
#frame .el.image.cropping .ghost{display:block}
#frame .el.table td.csel{box-shadow:inset 0 0 0 9999px var(--sel-soft)}
.h{position:absolute;display:none;width:calc(9px * var(--inv));height:calc(9px * var(--inv));transform:translate(-50%,-50%);background:#fff;border:calc(1.4px * var(--inv)) solid var(--sel);border-radius:2px;z-index:6;pointer-events:auto}
.el.sel.single .h,.el.editing .h,.el.line.sel .h{display:block}
.el.locked .h,.el.sel.multi .h{display:none!important}
.h.nw{left:0;top:0;cursor:nwse-resize}.h.n{left:50%;top:0;cursor:ns-resize}.h.ne{left:100%;top:0;cursor:nesw-resize}
.h.e{left:100%;top:50%;cursor:ew-resize}.h.se{left:100%;top:100%;cursor:nwse-resize}.h.s{left:50%;top:100%;cursor:ns-resize}
.h.sw{left:0;top:100%;cursor:nesw-resize}.h.w{left:0;top:50%;cursor:ew-resize}
.h.rot{left:50%;top:calc(-26px * var(--inv));border-radius:50%;background:var(--sel);cursor:grab}
.el.cropping .h.rot{display:none!important}
.el.cropping .h{background:var(--sel)}
.h.pt{border-radius:50%;cursor:crosshair;width:calc(11px * var(--inv));height:calc(11px * var(--inv))}
.h.pt.att{background:var(--guide);border-color:var(--guide)}
.crz,.rrz{position:absolute;display:none;z-index:5;pointer-events:auto}
.crz{top:0;bottom:0;width:calc(9px * var(--inv));transform:translateX(-50%);cursor:col-resize}
.rrz{left:0;right:0;height:calc(9px * var(--inv));transform:translateY(-50%);cursor:row-resize}
#frame .el.table.sel.single .crz,#frame .el.table.sel.single .rrz,#frame .el.table.editing .crz,#frame .el.table.editing .rrz{display:block}
#frame.show-anim .el[data-anim]::after{content:attr(data-anim);position:absolute;left:calc(-11px * var(--inv));top:calc(-11px * var(--inv));min-width:calc(20px * var(--inv));height:calc(20px * var(--inv));padding:0 calc(5px * var(--inv));border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 calc(12px * var(--inv))/calc(20px * var(--inv)) var(--ui);text-align:center;z-index:7}
#overlay .guide{position:absolute;display:none;background:#e0399a;z-index:9}
#overlay .guide.v{top:0;bottom:0;width:calc(1px * var(--inv))}#overlay .guide.h2{left:0;right:0;height:calc(1px * var(--inv))}
#overlay .gridbg{position:absolute;inset:0}
#overlay .ug{position:absolute;background:var(--guide);pointer-events:auto;z-index:8}
#overlay .ug.v{top:0;bottom:0;width:calc(1px * var(--inv));cursor:col-resize}
#overlay .ug.h{left:0;right:0;height:calc(1px * var(--inv));cursor:row-resize}
#overlay .ug.v::before{content:"";position:absolute;top:0;bottom:0;left:calc(-4px * var(--inv));right:calc(-4px * var(--inv))}
#overlay .ug.h::before{content:"";position:absolute;left:0;right:0;top:calc(-4px * var(--inv));bottom:calc(-4px * var(--inv))}
#overlay .mq{position:absolute;border:calc(1px * var(--inv)) solid var(--sel);background:var(--sel-soft)}
#overlay .mq.draw{border-style:dashed;background:transparent}
#overlay .drawline{position:absolute;left:0;top:0;overflow:visible}
#overlay .gbox{position:absolute;outline:calc(1.5px * var(--inv)) solid var(--sel)}
#overlay .gbox .h{display:block}
#overlay .gbox.nohandles .h{display:none}
#overlay .cbadge{position:absolute;width:calc(24px * var(--inv));height:calc(24px * var(--inv));border-radius:50% 50% 50% 2px;background:var(--note);color:#3b2a00;font:700 calc(11px * var(--inv))/calc(24px * var(--inv)) var(--ui);text-align:center;pointer-events:auto;cursor:pointer;transform:translate(-20%,-80%);box-shadow:0 1px 4px rgba(0,0,0,.25)}
#overlay .cdot{position:absolute;width:calc(10px * var(--inv));height:calc(10px * var(--inv));border-radius:50%;background:#fff;border:calc(1.6px * var(--inv)) solid var(--guide);transform:translate(-50%,-50%)}
#overlay .cdot.on{background:var(--guide)}

/* side panel */
#side{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.sidehead h2{margin:0;font:600 15px var(--ui)}
#sideBody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px;min-height:0}
.sec{display:grid;gap:10px}
.ih{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>.lab{flex:1}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer}
.chk input{width:auto;accent-color:var(--accent);margin:0}
input,textarea,select{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px var(--ui);width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=color]{width:44px;height:30px;padding:2px;flex:none;cursor:pointer}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:28px}
input[type=checkbox],input[type=radio]{width:auto}
textarea{resize:vertical}
.mono{font:12.5px/1.55 var(--mono)}
.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.hint.err{color:var(--danger)}
code,kbd{font:11.5px var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--raise);font:500 13px var(--ui);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.small{height:26px;padding:0 8px;font-size:12px}
.btn.danger{background:var(--danger);color:var(--panel);border-color:transparent}

const MATH_RE=/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|(?<!\\)\$(?:\\\$|[^$\n])+?(?<!\\)\$/g;
function md(src){
  const math=[];
  let s=String(src).replace(MATH_RE,m=>{math.push(m);return '\u0000'+(math.length-1)+'\u0000'});
  s=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+?)\*/g,'<i>$1</i>');
  let out='',list=null,li=false;
  const closeLi=()=>{if(li){out+='</li>';li=false}};
  const close=()=>{closeLi();if(list){out+='</'+list+'>';list=null}};
  s.split('\n').forEach(ln=>{
    let m;
    if((m=ln.match(/^\s*[-•]\s+(.*)$/))){if(list!=='ul'){close();out+='<ul>';list='ul'}closeLi();out+='<li>'+m[1];li=true}
    else if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){if(list!=='ol'){close();out+='<ol>';list='ol'}closeLi();out+='<li>'+m[1];li=true}
    else if(list&&ln.trim()){out+='<div>'+ln+'</div>'}
    else{close();out+=ln.trim()?'<div>'+ln+'</div>':'<div><br></div>'}
  });
  close();
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>esc(math[+i]));
}

  const ink=cs.getPropertyValue('--muted').trim()||'#666',soft=cs.getPropertyValue('--sel-soft').trim()||'rgba(42,109,212,.12)',edge=cs.getPropertyValue('--line').trim()||'#ccc';

  const minor=steps.find(st=>st*unitPx*scale>=7)||steps[steps.length-1];
  const ratio=[2,4,5,10,20,40,50,100].find(k=>minor*k*unitPx*scale>=46)||100;
  const els=selEls(),sb=els.length?unionBB(els):null;

    ctx.fillStyle=edge;const a0=origin,a1=origin+total*scale;

    if(sb){ctx.fillStyle=soft;const a=origin+(o==='h'?sb.x:sb.y)*scale,L=(o==='h'?sb.w:sb.h)*scale;if(o==='h')ctx.fillRect(a,0,L,20);else ctx.fillRect(0,a,20,L)}

        if(o==='h')ctx.fillText(lab,p+3,10);else{ctx.save();ctx.translate(10,p-3);ctx.rotate(-Math.PI/2);ctx.fillText(lab,0,0);ctx.restore()}}}
    ctx.stroke();
  });
}

function anchorOf(e,r,c){for(let rr=r;rr>=0;rr--)for(let cc=c;cc>=0;cc--){const x=e.cells[rr]&&e.cells[rr][cc];if(x&&!x.hide&&rr+x.rs>r&&cc+x.cs>c)return[rr,cc]}return[r,c]}
function selRange(e){
  let R;if(cellSel)R={r0:Math.min(cellSel.r0,cellSel.r1),r1:Math.max(cellSel.r0,cellSel.r1),c0:Math.min(cellSel.c0,cellSel.c1),c1:Math.max(cellSel.c0,cellSel.c1)};
  else if(editCell)R={r0:editCell.r,r1:editCell.r,c0:editCell.c,c1:editCell.c};
  else return{r0:0,c0:0,r1:e.rows-1,c1:e.cols-1};
  for(let it=0;it<8;it++){let ch=false;
    for(let r=R.r0;r<=R.r1;r++)for(let c=R.c0;c<=R.c1;c++){const a=anchorOf(e,r,c),x=e.cells[a[0]][a[1]];
      if(a[0]<R.r0){R.r0=a[0];ch=true}if(a[1]<R.c0){R.c0=a[1];ch=true}if(a[0]+x.rs-1>R.r1){R.r1=a[0]+x.rs-1;ch=true}if(a[1]+x.cs-1>R.c1){R.c1=a[1]+x.cs-1;ch=true}}
    if(!ch)break}
  R.r1=Math.min(R.r1,e.rows-1);R.c1=Math.min(R.c1,e.cols-1);return R;
}
function selectedCells(e){const R=selRange(e),out=[];for(let r=R.r0;r<=R.r1;r++)for(let c=R.c0;c<=R.c1;c++)if(!e.cells[r][c].hide)out.push([r,c]);return out}
function insertRow(e,k){const row=[];
  for(let c=0;c<e.cols;c++){let crossed=false;if(k>0&&k<e.rows){const a=anchorOf(e,k-1,c),x=e.cells[a[0]][a[1]];if(a[0]+x.rs>k){crossed=true;if(a[1]===c)x.rs++}}
    row.push(cellObj(crossed?{hide:true}:{align:(e.cells[Math.min(k,e.rows-1)][c]||{}).align||'left'}))}
  e.cells.splice(k,0,row);e.rowH.splice(k,0,e.rowH[Math.min(k,e.rows-1)]||44);e.rows++}
function deleteRow(e,k){
  for(let c=0;c<e.cols;c++){const x=e.cells[k][c];
    if(x.hide){const a=anchorOf(e,k,c);if(a[0]<k&&a[1]===c)e.cells[a[0]][a[1]].rs--}
    else if(x.rs>1&&e.cells[k+1]){Object.assign(e.cells[k+1][c],{html:x.html,fill:x.fill,align:x.align,valign:x.valign,rs:x.rs-1,cs:x.cs,hide:false})}}
  e.cells.splice(k,1);e.rowH.splice(k,1);e.rows--}
function insertCol(e,k){
  for(let r=0;r<e.rows;r++){let crossed=false;if(k>0&&k<e.cols){const a=anchorOf(e,r,k-1),x=e.cells[a[0]][a[1]];if(a[1]+x.cs>k){crossed=true;if(a[0]===r)x.cs++}}
    e.cells[r].splice(k,0,cellObj(crossed?{hide:true}:{}))}
  const avg=1/e.cols;e.colW.splice(k,0,avg);const s=e.colW.reduce((a,b)=>a+b,0);e.colW=e.colW.map(v=>v/s);e.cols++}
function deleteCol(e,k){
  for(let r=0;r<e.rows;r++){const x=e.cells[r][k];
    if(x.hide){const a=anchorOf(e,r,k);if(a[1]<k&&a[0]===r)e.cells[a[0]][a[1]].cs--}
    else if(x.cs>1&&e.cells[r][k+1]){Object.assign(e.cells[r][k+1],{html:x.html,fill:x.fill,align:x.align,valign:x.valign,rs:x.rs,cs:x.cs-1,hide:false})}}
  e.cells.forEach(row=>row.splice(k,1));e.colW.splice(k,1);const s=e.colW.reduce((a,b)=>a+b,0)||1;e.colW=e.colW.map(v=>v/s);e.cols--}
function mergeCells(e,R){
  if(R.r0===R.r1&&R.c0===R.c1){toast('Selecione duas ou mais células para mesclar (Shift+clique ou arraste).');return false}
  const a=e.cells[R.r0][R.c0];let extra=[];
  for(let r=R.r0;r<=R.r1;r++)for(let c=R.c0;c<=R.c1;c++){if(r===R.r0&&c===R.c0)continue;const x=e.cells[r][c];if(!x.hide&&x.html&&!isEmptyHTML(x.html))extra.push(x.html);Object.assign(x,{hide:true,rs:1,cs:1,html:''})}
  a.rs=R.r1-R.r0+1;a.cs=R.c1-R.c0+1;if(extra.length)a.html=(a.html||'')+extra.join('');return true;
}
function unmergeCells(e,R){for(let r=R.r0;r<=R.r1;r++)for(let c=R.c0;c<=R.c1;c++){const x=e.cells[r][c];if(!x.hide&&(x.rs>1||x.cs>1)){
  for(let rr=r;rr<r+x.rs;rr++)for(let cc=c;cc<c+x.cs;cc++)if(rr!==r||cc!==c)e.cells[rr][cc].hide=false;x.rs=1;x.cs=1}}}
function tableOp(op){
  const e=tbl();if(!e)return;const keep=editCell;if(editId)exitEdit(true);const R=selRange(e);
  switch(op){
    case 'rowAbove':insertRow(e,R.r0);break;case 'rowBelow':insertRow(e,R.r1+1);break;
    case 'colLeft':insertCol(e,R.c0);break;case 'colRight':insertCol(e,R.c1+1);break;
    case 'delRow':if(e.rows-(R.r1-R.r0+1)<1){removeEls([e.id]);return}for(let r=R.r1;r>=R.r0;r--)deleteRow(e,r);break;
    case 'delCol':if(e.cols-(R.c1-R.c0+1)<1){removeEls([e.id]);return}for(let c=R.c1;c>=R.c0;c--)deleteCol(e,c);break;
    case 'delTable':removeEls([e.id]);return;
    case 'merge':if(!mergeCells(e,R))return;break;case 'unmerge':unmergeCells(e,R);break;
    case 'distRows':{const avg=e.rowH.reduce((a,b)=>a+b,0)/e.rows;e.rowH=e.rowH.map(()=>Math.round(avg));break}
    case 'distCols':e.colW=e.colW.map(()=>1/e.cols);break;
    case 'header':e.header=!e.header;break;case 'band':e.band=!e.band;break;
  }
  cellSel=null;void keep;refreshEl(e);markSel();commit();renderToolbar();
}
function setCellProp(k,v){const e=tbl();if(!e)return;if(editId&&editCell){const keep=editCell;exitEdit(true);cellSel={r0:keep.r,c0:keep.c,r1:keep.r,c1:keep.c}}
  selectedCells(e).forEach(([r,c])=>{e.cells[r][c][k]=v});refreshEl(e);commit();renderToolbarSoon()}
function setCellBorders(mode){
  const e=tbl();if(!e)return;if(editId&&editCell){const k=editCell;exitEdit(true);cellSel={r0:k.r,c0:k.c,r1:k.r,c1:k.c}}
  const R=selRange(e),inR=(r,c)=>r>=R.r0&&r<=R.r1&&c>=R.c0&&c<=R.c1;
  const setSide=(r,c,k,v)=>{const a=anchorOf(e,r,c),x=e.cells[a[0]][a[1]];x.bd=x.bd||{t:true,r:true,b:true,l:true};x.bd[k]=v};
  for(let r=R.r0;r<=R.r1;r++)for(let c=R.c0;c<=R.c1;c++){
    const edge={t:r===R.r0,b:r===R.r1,l:c===R.c0,r:c===R.c1};
    ['t','b','l','r'].forEach(k=>{let v=mode==='all'?true:mode==='none'?false:mode==='outer'?edge[k]:!edge[k];
      if(mode==='inner'&&edge[k])return;if(mode==='outer'&&!edge[k])v=false;
      setSide(r,c,k,v);
      const nb={t:[r-1,c,'b'],b:[r+1,c,'t'],l:[r,c-1,'r'],r:[r,c+1,'l']}[k];
      if(nb[0]>=0&&nb[0]<e.rows&&nb[1]>=0&&nb[1]<e.cols&&!inR(nb[0],nb[1]))setSide(nb[0],nb[1],nb[2],v)})}
  refreshEl(e);commit();
}
function moveCell(dir){
  const e=editEl();if(!e||e.type!=='table'||!editCell)return;let r=editCell.r,c=editCell.c;
  const vis=[];for(let rr=0;rr<e.rows;rr++)for(let cc=0;cc<e.cols;cc++)if(!e.cells[rr][cc].hide)vis.push([rr,cc]);
  const i=vis.findIndex(v=>v[0]===r&&v[1]===c);let j=i+dir;
  if(j>=vis.length){exitEdit(true);insertRow(e,e.rows);refreshEl(e);commit();setTimeout(()=>enterEdit(e,'end',{r:e.rows-1,c:0}),60);return}
  if(j<0)j=0;enterEdit(e,'end',{r:vis[j][0],c:vis[j][1]});

function insertTable(rows,cols){
  const w=Math.min(Math.round(W*.75),Math.max(300,cols*160)),e=tableEl(rows,cols,{w:w,x:Math.round((W-w)/2),y:Math.round(H*.24)});

function tableFromTSV(text){

  const cols=Math.max(...rows.map(r=>r.length)),e=tableEl(rows.length,cols,{});
  rows.forEach((row,r)=>{for(let c=0;c<cols;c++)e.cells[r][c].html=row[c]&&row[c].trim()?md(row[c].trim()):''});
  e.w=Math.min(Math.round(W*.85),Math.max(320,cols*170));e.x=Math.round((W-e.w)/2);e.y=Math.round(H*.18);return e;
}

/* ---------- format painter ---------- */
const PAINT_KEYS={box:['size','color','font','bold','align','valign','lh','ps','pad','fill','fillOpacity','stroke','strokeW','dash','join','radius','shadow','opacity','outline','outlineW','textShadow','dir'],
  image:['opacity','radius','stroke','strokeW','shadow','bright','contrast','gray','reflect'],line:['stroke','strokeW','dash','cap','startCap','endCap','route','shadow','opacity'],
  table:['size','color','font','borderColor','borderW','pad','headerFill','header','band'],ink:['opacity','shadow'],chart:['size','legend','grid','colors','logY'],media:['opacity','shadow']};
function startPainter(){const e=selEls()[0];if(!e){toast('Selecione o elemento com a formatação que deseja copiar.');return}
  const props={};(PAINT_KEYS[e.type]||[]).forEach(k=>{props[k]=JSON.parse(JSON.stringify(e[k]===undefined?null:e[k]))});
  painter={type:e.type,props:props};stageWrap.classList.add('painting');renderToolbar();toast('Clique no elemento que deve receber a formatação. Esc cancela.')}
function stopPainter(){painter=null;stageWrap.classList.remove('painting');renderToolbar()}
function applyPainter(e){
  if(!painter||!e)return;const p=painter;
  const keys=p.type===e.type?Object.keys(p.props):(PAINT_KEYS[e.type]||[]).filter(k=>k in p.props);
  keys.forEach(k=>{e[k]=JSON.parse(JSON.stringify(p.props[k]))});
  if(e.type==='box'&&p.type==='box')e.html=stripStyle(stripStyle(stripStyle(e.html,'color'),'font-size'),'font-family');
  refreshEl(e);stopPainter();select([e.id]);commit();
}

/* ---------- inserts ---------- */
function readImage(file,cb){
  if(!file||!/^image\//.test(file.type)){toast('Esse arquivo não é uma imagem.');return}
  const fr=new FileReader();
  fr.onload=()=>{let src=fr.result;const im=new Image();
    im.onload=()=>{let nw=im.naturalWidth||400,nh=im.naturalHeight||300;
      if(file.type!=='image/svg+xml'&&Math.max(nw,nh)>1800){const k=1800/Math.max(nw,nh),c=document.createElement('canvas');c.width=Math.round(nw*k);c.height=Math.round(nh*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);src=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9);nw=c.width;nh=c.height}
      cb(src,nw,nh)};
    im.onerror=()=>toast('Não foi possível ler essa imagem.');im.src=src};
  fr.readAsDataURL(file);
}
function addImage(src,nw,nh){const k=Math.min(1,(W*.5)/nw,(H*.66)/nh),w=Math.round(nw*k),h=Math.round(nh*k);addEls([imageEl({src:src,x:Math.round((W-w)/2),y:Math.round((H-h)/2),w:w,h:h})])}
function pickImage(target){replaceTarget=target||null;$('#imgFile').click()}
$('#imgFile').addEventListener('change',ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
  readImage(f,(src,nw,nh)=>{if(replaceTarget){const e=replaceTarget;replaceTarget=null;e.src=src;e.crop={l:0,t:0,r:0,b:0};e.h=Math.round(e.w*nh/nw);const d=elDom(e);if(d){fillEl(d,e,true);styleEl(d,e)}commit();thumbSoon()}else addImage(src,nw,nh)})});
function addImageURL(url,quiet){
  if(/^data:image\//.test(url)){fetch(url).then(r=>r.blob()).then(b=>readImage(new File([b],'img',{type:b.type}),addImageCascade)).catch(()=>toast('Não foi possível ler essa imagem.'));return}
  if(/^https?:/i.test(url))fetch(url,{mode:'cors'}).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{if(!/^image\//.test(b.type))throw 0;readImage(new File([b],'img',{type:b.type}),addImageCascade)}).catch(()=>addImageURLRaw(url,quiet));
  else addImageURLRaw(url,quiet);
}
let pasteCascade={t:0,n:0};
function addImageCascade(src,nw,nh){const now=Date.now();if(now-pasteCascade.t>1500)pasteCascade.n=0;pasteCascade.t=now;const k=pasteCascade.n++;
  const s=Math.min(1,(W*.5)/nw,(H*.66)/nh),w=Math.round(nw*s),h=Math.round(nh*s);addEls([imageEl({src:src,x:Math.round((W-w)/2)+k*24,y:Math.round((H-h)/2)+k*24,w:w,h:h})])}
function addImageURLRaw(url,quiet){
  const im=new Image();im.onload=()=>addImageCascade(url,im.naturalWidth,im.naturalHeight);
  im.onerror=()=>toast(standalone?'Não consegui carregar essa imagem. Confira o endereço.':'Aqui no Claude só dá para usar imagens enviadas do computador. Na versão local, links de imagem funcionam.');
  im.src=url;
}
function insertWordArt(){const e=box({x:Math.round(W*.15),y:Math.round(H*.36),w:Math.round(W*.7),h:150,size:84,bold:true,align:'center',valign:'middle',color:'accent',outline:'title',outlineW:2,textShadow:true,font:'title',html:'<div>Texto artístico</div>'});

function insertMediaFromFile(f){
  const kind=/^audio\//.test(f.type)?'audio':'video';
  const done=src=>{const e=mediaEl({kind:kind,src:src,title:f.name,h:kind==='audio'?90:360,y:kind==='audio'?Math.round(H/2-45):150});addEls([e])};

/* ---------- diagrams ---------- */
function connectLine(a,sa,b,sb,o){const p=connPoint(a,sa),q=connPoint(b,sb);return lineEl(Object.assign({x1:Math.round(p[0]),y1:Math.round(p[1]),x2:Math.round(q[0]),y2:Math.round(q[1]),a1:{id:a.id,side:sa},a2:{id:b.id,side:sb},endCap:'arrow',stroke:'fg',strokeW:3},o))}
function sideToward(a,b){const dx=(b.x+b.w/2)-(a.x+a.w/2),dy=(b.y+b.h/2)-(a.y+a.h/2);return Math.abs(dx)>=Math.abs(dy)?(dx>0?['e','w']:['w','e']):(dy>0?['s','n']:['n','s'])}
function insertDiagram(kind,n){
  const g=uid(),shapes=[],lines=[],cx=W/2,cy=H/2+20;
  if(kind==='process'){const gap=56,bw=Math.min(240,(W*.86-(n-1)*gap)/n),bh=Math.min(130,bw*.6),x0=(W-(n*bw+(n-1)*gap))/2;
    for(let i=0;i<n;i++){shapes.push(shapeEl('round',{x:Math.round(x0+i*(bw+gap)),y:Math.round(cy-bh/2),w:Math.round(bw),h:Math.round(bh),size:22,color:'fg',html:'<div>Etapa '+(i+1)+'</div>',group:g}))}
    for(let i=1;i<n;i++)lines.push(connectLine(shapes[i-1],'e',shapes[i],'w',{group:g}))}
  else if(kind==='cycle'){const R=Math.min(W,H)*.3,bw=170,bh=86;
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;shapes.push(shapeEl('round',{x:Math.round(cx+R*Math.cos(a)*1.25-bw/2),y:Math.round(cy+R*Math.sin(a)-bh/2),w:bw,h:bh,size:20,color:'fg',html:'<div>Fase '+(i+1)+'</div>',group:g}))}
    for(let i=0;i<n;i++){const a=shapes[i],b=shapes[(i+1)%n],sd=sideToward(a,b);lines.push(connectLine(a,sd[0],b,sd[1],{route:'curve',group:g}))}}
  else if(kind==='hierarchy'){const bw=Math.min(200,(W*.86-(n-1)*30)/n),bh=80,top=shapeEl('round',{x:Math.round(cx-110),y:Math.round(H*.24),w:220,h:bh,size:22,color:'fg',html:'<div>Topo</div>',group:g,fill:'accent',fillOpacity:.3});
    shapes.push(top);const x0=(W-(n*bw+(n-1)*30))/2;
    for(let i=0;i<n;i++){const c=shapeEl('round',{x:Math.round(x0+i*(bw+30)),y:Math.round(H*.6),w:Math.round(bw),h:bh,size:20,color:'fg',html:'<div>Item '+(i+1)+'</div>',group:g});shapes.push(c);lines.push(connectLine(top,'s',c,'n',{route:'elbow',endCap:'none',group:g}))}}
  else if(kind==='venn'){n=Math.min(3,Math.max(2,n));const r=Math.min(W,H)*.24,pos=n===2?[[-.55,0],[.55,0]]:[[-.5,-.35],[.5,-.35],[0,.45]];
    pos.forEach((p,i)=>shapes.push(shapeEl('ellipse',{x:Math.round(cx+p[0]*r-r),y:Math.round(cy+p[1]*r-r),w:Math.round(2*r),h:Math.round(2*r),fill:SERIES[i%SERIES.length],fillOpacity:.32,stroke:SERIES[i%SERIES.length],strokeW:2,size:22,color:'fg',
      valign:p[1]<0?'top':'bottom',pad:Math.round(r*.35),html:'<div>Conjunto '+String.fromCharCode(65+i)+'</div>',group:g})))}
  else if(kind==='timeline'){const x0=W*.08,x1=W*.92,y=cy;lines.push(lineEl({x1:Math.round(x0),y1:Math.round(y),x2:Math.round(x1),y2:Math.round(y),endCap:'arrow',stroke:'fg',strokeW:3,group:g}));
    for(let i=0;i<n;i++){const x=x0+(x1-x0)*(i+.5)/n;shapes.push(shapeEl('ellipse',{x:Math.round(x-11),y:Math.round(y-11),w:22,h:22,fill:'accent',fillOpacity:1,strokeW:0,group:g}));
      shapes.push(box({x:Math.round(x-90),y:Math.round(i%2?y+24:y-84),w:180,h:60,size:20,align:'center',valign:i%2?'top':'bottom',html:'<div>'+(2020+i)+'</div>',group:g}))}}
  addEls(shapes.concat(lines));
}

const gvEl=()=>overlay.querySelector('.guide.v'),ghEl=()=>overlay.querySelector('.guide.h2');

/* indicadores: linha horizontal/vertical e mesmo tamanho */
function axisSnap(a,q,on){
  if(!on)return{q:q,ax:null};const dx=q.x-a.x,dy=q.y-a.y,L=Math.hypot(dx,dy);if(L<12)return{q:q,ax:null};
  const tol=Math.max(4/scale,L*Math.tan(2.5*Math.PI/180));
  if(Math.abs(dy)<=tol)return{q:{x:q.x,y:a.y},ax:'h'};if(Math.abs(dx)<=tol)return{q:{x:a.x,y:q.y},ax:'v'};return{q:q,ax:null};
}
function showAxisBadge(ax,a,q){const b=overlay&&overlay.querySelector('.axb');if(!b)return;if(!ax){b.hidden=true;return}
  b.hidden=false;b.textContent=ax==='h'?'⟷ Horizontal':'↕ Vertical';b.style.left=((a.x+q.x)/2)+'px';b.style.top=((a.y+q.y)/2)+'px';b.classList.toggle('v',ax==='v')}
function sizeMatch(id,w,h,useW,useH){
  const th=6/scale;let mw=null,mh=null;
  slide().els.forEach(o=>{if(o.id===id||o.type==='line'||(o.rot||0)%180)return;
    if(useW&&Math.abs(o.w-w)<th&&(!mw||Math.abs(o.w-w)<Math.abs(mw.w-w)))mw=o;
    if(useH&&Math.abs(o.h-h)<th&&(!mh||Math.abs(o.h-h)<Math.abs(mh.h-h)))mh=o});
  return{mw:mw,mh:mh};
}
function showEqMarks(r,m){const c=overlay&&overlay.querySelector('.eqms');if(!c)return;if(!r||!m||(!m.mw&&!m.mh)){c.innerHTML='';return}
  const wm=q=>'<div class="eqm w" style="left:'+q.x+'px;top:'+q.y+'px;width:'+q.w+'px"></div>',hm=q=>'<div class="eqm h" style="left:'+(q.x+q.w)+'px;top:'+q.y+'px;height:'+q.h+'px"></div>';
  let h='';if(m.mw)h+=wm(r)+wm(m.mw);if(m.mh)h+=hm(r)+hm(m.mh);c.innerHTML=h}
function clearIndicators(){if(!overlay)return;const c=overlay.querySelector('.eqms');if(c)c.innerHTML='';const b=overlay.querySelector('.axb');if(b)b.hidden=true}

const IMG_URL_RE=/^(https?:\/\/\S+\.(png|jpe?g|gif|webp|svg|avif|bmp)(\?\S*)?|data:image\/[\w+.-]+;base64,\S+)$/i;
function clipImages(dt){
  if(!dt)return null;const files=[];
  Array.from(dt.files||[]).forEach(f=>{if(/^image\//.test(f.type))files.push(f)});
  if(!files.length)Array.from(dt.items||[]).forEach(i=>{if(i.kind==='file'&&/^image\//.test(i.type)){const f=i.getAsFile();if(f)files.push(f)}});
  if(files.length)return{files:files,urls:[]};
  const html=dt.getData('text/html');let urls=[];
  if(html&&/<img/i.test(html)){try{const d=new DOMParser().parseFromString(html,'text/html');const txt=(d.body.textContent||'').trim();
    if(txt.length<40)urls=Array.from(d.images).map(i=>i.getAttribute('src')).filter(u=>u&&/^(https?:|data:image\/)/i.test(u))}catch(e){}}
  if(!urls.length){const t=(dt.getData('text/uri-list')||dt.getData('text/plain')||'').trim().split(/\r?\n/).filter(l=>l&&l[0]!=='#');if(t.length&&t.every(u=>IMG_URL_RE.test(u.trim())))urls=t.map(u=>u.trim())}

const findState={q:'',r:'',cs:false,notes:true,results:[],idx:-1};
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function findAll(){
  const out=[];const q=findState.q;if(!q)return out;const re=new RegExp(escRe(q),findState.cs?'g':'gi');
  const scan=(html,where)=>{const t=textOf(html);let m;re.lastIndex=0;while((m=re.exec(t))){out.push(Object.assign({text:t,at:m.index,len:m[0].length},where));if(!m[0].length)break}};
  deck.slides.forEach((s,si)=>{s.els.forEach(e=>{if(e.type==='box')scan(e.html,{si:si,el:e.id});else if(e.type==='table')e.cells.forEach((row,r)=>row.forEach((c,cc)=>{if(!c.hide)scan(c.html,{si:si,el:e.id,cell:{r:r,c:cc}})}))});
    if(findState.notes&&s.notes)scan(esc(s.notes),{si:si,notes:true})});
  return out;
}
function replaceInHTML(html,once){
  const re=new RegExp(escRe(findState.q),findState.cs?(once?'':'g'):(once?'i':'gi'));let done=false,count=0;
  const d=document.createElement('div');d.innerHTML=html||'';
  const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(once&&done)return;const v=n.nodeValue.replace(re,()=>{count++;done=true;return findState.r});if(v!==n.nodeValue)n.nodeValue=v});
  return{html:d.innerHTML,count:count};
}
function replaceAll(){
  if(!findState.q)return;if(editId)exitEdit();let n=0;
  deck.slides.forEach(s=>{s.els.forEach(e=>{if(e.type==='box'){const r=replaceInHTML(e.html);e.html=r.html;n+=r.count}else if(e.type==='table')e.cells.forEach(row=>row.forEach(c=>{if(!c.hide){const r=replaceInHTML(c.html);c.html=r.html;n+=r.count}}))});
    if(findState.notes&&s.notes){const re=new RegExp(escRe(findState.q),findState.cs?'g':'gi');s.notes=s.notes.replace(re,()=>{n++;return findState.r})}});
  rerenderAll();commit();toast(n?n+' substituições feitas.':'Nada encontrado.');renderSide();
}
function replaceOne(){
  const res=findState.results[findState.idx];if(!res){toast('Escolha um resultado na lista.');return}if(editId)exitEdit();
  const s=deck.slides[res.si];
  if(res.notes){const re=new RegExp(escRe(findState.q),findState.cs?'':'i');s.notes=s.notes.replace(re,findState.r)}
  else{const e=s.els.find(x=>x.id===res.el);if(!e)return;if(res.cell){const c=e.cells[res.cell.r][res.cell.c];c.html=replaceInHTML(c.html,true).html}else e.html=replaceInHTML(e.html,true).html}
  if(res.si===cur)renderStage();rebuildThumbs();commit();renderSide();
}

function htmlToLatex(html){
  const d=document.createElement('div');d.innerHTML=html||'';
  const escT=s=>{let out='',last=0;s.replace(MATH_RE,(m,off)=>{out+=escText(s.slice(last,off))+m;last=off+m.length;return m});return out+escText(s.slice(last))};
  const escText=s=>s.replace(/\\/g,'\\textbackslash{}').replace(/([&%#_{}])/g,'\\$1').replace(/~/g,'\\textasciitilde{}').replace(/\^/g,'\\textasciicircum{}').replace(/\u00a0/g,'~');
  const walk=n=>{
    if(n.nodeType===3)return escT(n.nodeValue);if(n.nodeType!==1)return '';
    const inner=Array.from(n.childNodes).map(walk).join('');
    switch(n.tagName){
      case 'B':return '\\textbf{'+inner+'}';case 'I':return '\\emph{'+inner+'}';case 'U':return '\\underline{'+inner+'}';case 'S':return inner;
      case 'SUB':return '\\textsubscript{'+inner+'}';case 'SUP':return '\\textsuperscript{'+inner+'}';case 'BR':return '\\\\\n';
      case 'A':{const h=n.getAttribute('href')||'';if(h.indexOf('#slide:')===0)return inner;return '\\href{'+h.replace(/([%#])/g,'\\$1')+'}{'+inner+'}'}
      case 'SPAN':{const c=n.style.color;return c?'\\textcolor[HTML]{'+toHex(c).slice(1).toUpperCase()+'}{'+inner+'}':inner}
      case 'UL':return '\n\\begin{itemize}\n'+Array.from(n.children).map(li=>'  \\item '+walk(li).trim()).join('\n')+'\n\\end{itemize}\n';
      case 'OL':return '\n\\begin{enumerate}\n'+Array.from(n.children).map(li=>'  \\item '+walk(li).trim()).join('\n')+'\n\\end{enumerate}\n';
      case 'LI':return inner;case 'DIV':return inner.trim()?inner+'\n\n':'';
    }
    return inner;
  };
  return Array.from(d.childNodes).map(walk).join('').replace(/\n{3,}/g,'\n\n').trim();
}
function tableToLatex(e){
  const cols=e.cols,spec='|'+e.colW.map(f=>'p{'+(f*.95).toFixed(2)+'\\linewidth}').join('|')+'|';
  let s='\\begin{tabular}{'+spec+'}\n\\hline\n';
  for(let r=0;r<e.rows;r++){const parts=[];for(let c=0;c<cols;c++){const x=e.cells[r][c];if(x.hide){const a=anchorOf(e,r,c);if(a[0]<r&&a[1]===c)parts.push('');continue}
      let t=htmlToLatex(x.html).replace(/\n+/g,' ');if(e.header&&r===0)t='\\textbf{'+t+'}';if(x.cs>1)t='\\multicolumn{'+x.cs+'}{|c|}{'+t+'}';if(x.rs>1)t='\\multirow{'+x.rs+'}{*}{'+t+'}';parts.push(t)}
    s+=parts.join(' & ')+' \\\\ \\hline\n'}
  return s+'\\end{tabular}';
}
function beamerTikzPreamble(){
  const tk=[];deck.slides.forEach(s=>s.els.forEach(e=>{if(e.type==='tikz')tk.push(e)}));const fn=deck.slides.some(s=>s.els.some(e=>e.type==='chart'&&e.kind==='fn'));
  const imp=deck.texPkgs.map(c=>'% Pacote '+c.name+' (importado no Lousa TeX)\n\\makeatletter\n'+c.code+'\n\\makeatother\n').join('');
  if(!tk.length&&!fn)return imp;
  const pk=new Set(['tikz']),libs=new Set(),custom=new Set();if(fn)pk.add('pgfplots');
  tk.forEach(e=>{(e.pkgs||[]).forEach(n=>{if(TIKZ_NATIVE[n]||n==='tikz-feynman')pk.add(n);else custom.add(n)});String(e.libs||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(l=>libs.add(l))});
  let out='\\usepackage{'+Array.from(pk).join(',')+'}\n';if(pk.has('pgfplots'))out+='\\pgfplotsset{compat=1.18}\n';if(libs.size)out+='\\usetikzlibrary{'+Array.from(libs).join(',')+'}\n';
  out+=imp;void custom;
  if(pk.has('tikz-feynman'))out+='% tikz-feynman: para posicionamento automático compile com LuaLaTeX\n';
  return out;
}

function exportBeamer(){
  if(editId)exitEdit();
  const ratio=Math.abs(W/H-16/9)<.05?'169':Math.abs(W/H-16/10)<.05?'1610':Math.abs(W/H-4/3)<.05?'43':'169';
  let s='% Exportado do Lousa TeX em '+new Date().toLocaleString('pt-BR')+'\n\\documentclass[aspectratio='+ratio+']{beamer}\n\\usepackage[brazil]{babel}\n\\usepackage[utf8]{inputenc}\n\\usepackage[T1]{fontenc}\n'+
    '\\usepackage{amsmath,amssymb,braket,cancel,multirow,xcolor,hyperref'+((deck.packages||[]).length?','+deck.packages.join(','):'')+'}\n\\usetheme{default}\n\\setbeamertemplate{navigation symbols}{}\n'+(deck.theme.showNumbers?'\\setbeamertemplate{footline}[frame number]\n':'')+
    beamerTikzPreamble()+(deck.preamble?'% Preâmbulo do Lousa TeX\n'+deck.preamble+'\n':'')+'\\title{'+htmlToLatex(esc(deck.title))+'}\n\\date{}\n\n\\begin{document}\n';
  deck.slides.forEach((sl,i)=>{
    if(sl.skip)s+='% (slide ignorado na apresentação)\n';
    const title=sl.els.find(e=>e.type==='box'&&e.role==='title');
    const rest=sl.els.filter(e=>e!==title).slice().sort((a,b)=>(bb(a).y-bb(b).y)||(bb(a).x-bb(b).x));
    if(sl.layout==='section'&&title)s+='\n\\section{'+htmlToLatex(title.html).replace(/\n+/g,' ')+'}';
    s+='\n% ---- Slide '+(i+1)+' ----\n\\begin{frame}'+(title&&!isEmptyHTML(title.html)?'{'+htmlToLatex(title.html).replace(/\n+/g,' ')+'}':'')+'\n';
    rest.forEach(e=>{
      if(e.type==='box'&&e.role==='refs'){s+=beamerBib()+'\n';return}
      if(e.type==='box'&&e.role==='toc'){s+='\\tableofcontents\n';return}
      if(e.type==='tikz'){s+='\\begin{center}\n'+(e.code||'')+'\n\\end{center}\n\n';return}
      if(e.type==='chart'&&e.kind==='fn'){s+=fnToPgf(e)+'\n';return}
      if(e.type==='box'&&!isEmptyHTML(e.html)){let t=htmlToLatex(e.html);if(e.anim&&e.anim.byPara)t=t.replace(/\\begin\{(itemize|enumerate)\}/g,'\\begin{$1}[<+->]');
        s+=(e.align==='center'?'\\begin{center}\n'+t+'\n\\end{center}':t)+'\n\n'}

      else if(e.type==='image')s+='% Imagem: salve-a como arquivo e use \\includegraphics[width=0.5\\linewidth]{imagem}\n';
      else if(e.type==='chart')s+='% Gráfico "'+(e.title||CHART_KINDS[e.kind])+'": recrie com pgfplots ou insira como imagem\n';
      else if(e.type==='media')s+='% Mídia: '+(e.url||e.title||'arquivo local')+'\n';
    });
    if(sl.notes)s+='\\note{'+htmlToLatex(esc(sl.notes)).replace(/\n+/g,' \\\\ ')+'}\n';
    s+='\\end{frame}\n';
  });

  s+='\n\\end{document}\n';
  saveFile(slug(deck.title)+'.tex',s,'application/x-tex');
}

function buildUnits(node,s){

function kf(kind,fx){

    zoom:[{opacity:0,scale:'.3'},{opacity:1,scale:'1'}],spin:[{opacity:0,rotate:'-200deg',scale:'.3'},{opacity:1,rotate:'0deg',scale:'1'}],wipe:[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}]};
  if(kind==='in')return IN[fx]||null;
  if(kind==='out'){if(fx==='sink')return[{opacity:1,translate:'0 0'},{opacity:0,translate:'0 40px'}];if(fx==='wipe')return[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}];const k=IN[fx];return k?k.slice().reverse():null}

    flash:[{opacity:1},{opacity:.15},{opacity:1},{opacity:.15},{opacity:1}],grow:[{scale:'1'},{scale:'1.25'},{scale:'1'}]};

function cmdPalette(){
  const all=[];(function walk(items,path){items.forEach(it=>{if(!it||it.sep)return;const p=path?path+' › '+it.label:it.label;if(it.sub)walk(typeof it.sub==='function'?it.sub():it.sub,p);else if(!it.disabled&&it.act)all.push({p:p,sc:it.sc||'',act:it.act})})})(
    Object.keys(MENUS).map(k=>({label:{arquivo:'Arquivo',editar:'Editar',exibir:'Exibir',inserir:'Inserir',formatar:'Formatar',slide:'Slide',organizar:'Organizar',ferramentas:'Ferramentas',ajuda:'Ajuda'}[k],sub:MENUS[k]()})),'');
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();let hits=all,k=0;
  openModal('Pesquisar nos menus','<input class="cmdin" id="cmdQ" placeholder="Digite um comando: tabela, ignorar slide, preâmbulo…" autocomplete="off"><div class="cmdlist" id="cmdL"></div>',{mount:b=>{
    const q=b.querySelector('#cmdQ'),L=b.querySelector('#cmdL');
    const draw=()=>{L.innerHTML=hits.slice(0,60).map((h,i)=>'<div class="ci'+(i===k?' on':'')+'" data-i="'+i+'"><span>'+esc(h.p)+'</span><small>'+esc(h.sc)+'</small></div>').join('')||'<p class="hint">Nenhum comando encontrado.</p>'};
    const run=i=>{const h=hits[i];if(!h)return;closeModal();h.act()};
    q.addEventListener('input',()=>{const t=norm(q.value).split(/\s+/).filter(Boolean);hits=all.filter(h=>{const n=norm(h.p);return t.every(w=>n.includes(w))});k=0;draw()});
    q.addEventListener('keydown',ev=>{if(ev.key==='ArrowDown'){ev.preventDefault();k=Math.min(hits.length-1,k+1);draw()}else if(ev.key==='ArrowUp'){ev.preventDefault();k=Math.max(0,k-1);draw()}else if(ev.key==='Enter'){ev.preventDefault();run(k)}});
    L.addEventListener('click',ev=>{const c=ev.target.closest('[data-i]');if(c)run(+c.dataset.i)});draw()}});
}

    try{st.ul=document.queryCommandState('insertUnorderedList');st.ol=document.queryCommandState('insertOrderedList')}catch(e){}

/* ================= Google Drive ================= */
/* Para que todos que abrirem o site já usem o Drive, preencha o arquivo config.js ao lado do index.html.
   Também dá para informar pelo menu Arquivo › Google Drive › Configurar (fica salvo só neste navegador). */
const DRIVE_DEFAULT=Object.assign({clientId:'',apiKey:'',appId:''},(window.LOUSA_CONFIG&&window.LOUSA_CONFIG.drive)||{});
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_MIME='application/vnd.lousa-tex+json';
const D={token:null,exp:0,tc:null,loaded:null,user:''};
const driveCfg=()=>({clientId:(prefs.driveClientId||DRIVE_DEFAULT.clientId||'').trim(),apiKey:(prefs.driveApiKey||DRIVE_DEFAULT.apiKey||'').trim(),appId:(prefs.driveAppId||DRIVE_DEFAULT.appId||'').trim()});
const driveHosted=()=>standalone&&/^https?:$/.test(location.protocol);
const driveReady=()=>{const c=driveCfg();return !!(c.clientId&&c.apiKey)};
const driveOn=()=>!!D.token&&Date.now()<D.exp-60000;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar '+src+'. Verifique a conexão.'));document.head.appendChild(s)})}
function driveLoad(){
  if(!D.loaded)D.loaded=Promise.all([loadScript('https://accounts.google.com/gsi/client'),loadScript('https://apis.google.com/js/api.js')])
    .then(()=>new Promise(ok=>gapi.load('picker',ok))).catch(e=>{D.loaded=null;throw e});
  return D.loaded;
}
function driveToken(interactive){
  if(driveOn())return Promise.resolve(D.token);
  if(!interactive)return Promise.reject(new Error('reconnect'));
  return driveLoad().then(()=>new Promise((ok,no)=>{
    if(!D.tc)D.tc=google.accounts.oauth2.initTokenClient({client_id:driveCfg().clientId,scope:DRIVE_SCOPE,callback:()=>{}});
    D.tc.callback=r=>{if(r.error){no(new Error(r.error));return}D.token=r.access_token;D.exp=Date.now()+(+r.expires_in||3600)*1000;ok(D.token)};
    D.tc.error_callback=e=>no(new Error((e&&e.type)||'popup_failed'));
    D.tc.requestAccessToken({prompt:''});
  }));
}
function driveErr(e){
  const m=String(e&&e.message||e);
  if(m==='reconnect'){setSaveState('Drive desconectado');toast('A conexão com o Drive expirou. Use Arquivo › Google Drive › Conectar.');return}
  if(/popup_closed|access_denied/.test(m)){toast('Conexão com o Google Drive cancelada.');return}
  if(/popup_failed_to_open|popup_failed/.test(m)){toast('O navegador bloqueou a janela do Google. Permita pop-ups para este site.');return}
  setSaveState('Erro no Drive');toast('Google Drive: '+m);
}
async function dfetch(url,opt){
  const t=await driveToken(false);opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+t},opt.headers||{});
  const r=await fetch(url,opt);
  if(r.status===401){D.token=null;throw new Error('reconnect')}
  if(r.status===404)throw new Error('o arquivo não foi encontrado ou o Lousa TeX não tem acesso a ele. Abra-o pelo seletor do Drive.');
  if(!r.ok)throw new Error('o Drive respondeu com erro '+r.status+'.');
  return r;
}
const driveMap=()=>{try{return JSON.parse(lsGet('lousa-drive-map')||'{}')}catch(e){return{}}};
const driveIdOf=()=>driveMap()[deck.id]||null;
function setDriveId(fid){const m=driveMap();if(fid)m[deck.id]=fid;else delete m[deck.id];try{lsSet('lousa-drive-map',JSON.stringify(m))}catch(e){}}
function multipart(meta,body){return '--lousa\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--lousa\r\nContent-Type: '+DRIVE_MIME+'\r\n\r\n'+body+'\r\n--lousa--'}
let driveSaving=null;
async function driveSave(asNew,folderId){
  if(editId)exitEdit();commitSoon.flush();
  const body=JSON.stringify(deck),name=(deck.title||'Apresentação').replace(/[\\/]/g,'-')+'.lousa.json';let fid=asNew?null:driveIdOf();
  setSaveState('Salvando no Drive…');
  if(fid){await dfetch('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=multipart&fields=id',{method:'PATCH',headers:{'Content-Type':'multipart/related; boundary=lousa'},body:multipart({name:name},body)})}
  else{const meta={name:name,mimeType:DRIVE_MIME,description:'Apresentação do Lousa TeX'};if(folderId)meta.parents=[folderId];
    const r=await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary=lousa'},body:multipart(meta,body)});
    fid=(await r.json()).id;setDriveId(fid)}
  setSaveState('Salvo no Drive');return fid;
}
const driveAuto=debounce(()=>{if(!driveIdOf()||!driveOn())return;if(driveSaving)return driveAuto();driveSaving=driveSave().catch(driveErr).finally(()=>{driveSaving=null})},3000);
driveHook=()=>{if(driveIdOf())driveAuto()};
async function driveOpenId(fid){
  setSaveState('Abrindo do Drive…');
  const r=await dfetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fid)+'?alt=media');
  const d=parseDeckText(await r.text());if(!d){setSaveState('Salvo neste navegador');toast('Esse arquivo não é uma apresentação do Lousa TeX.');return}
  openDeck(d,'Aberta do Google Drive. As alterações são salvas lá automaticamente.');setDriveId(fid);setSaveState('Salvo no Drive');
}
function picker(view,title,cb){
  const c=driveCfg();
  const pb=new google.picker.PickerBuilder().setOAuthToken(D.token).setDeveloperKey(c.apiKey).addView(view).setLocale('pt-BR').setTitle(title)
    .setCallback(d=>{if(d.action===google.picker.Action.PICKED&&d.docs&&d.docs[0])cb(d.docs[0])});
  if(c.appId)pb.setAppId(c.appId);pb.build().setVisible(true);
}
function driveGuard(){
  if(!driveHosted()){driveInfoModal();return false}
  if(!driveReady()){driveSetupModal();return false}
  return true;
}
async function driveConnect(){if(!driveGuard())return;try{await driveToken(true);toast('Conectado ao Google Drive.')}catch(e){driveErr(e)}}
async function driveOpen(){
  if(!driveGuard())return;
  try{await driveToken(true);await driveLoad();
    const v=new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes(DRIVE_MIME+',application/json').setMode(google.picker.DocsViewMode.LIST).setIncludeFolders(true);
    picker(v,'Abrir apresentação do Lousa TeX',f=>driveOpenId(f.id).catch(driveErr));

const FNS={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,arcsin:Math.asin,arccos:Math.acos,arctan:Math.atan,
  sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,asinh:Math.asinh,acosh:Math.acosh,atanh:Math.atanh,exp:Math.exp,ln:Math.log,log:Math.log,log10:Math.log10,log2:Math.log2,
  sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs,sign:Math.sign,floor:Math.floor,ceil:Math.ceil,round:Math.round,sec:x=>1/Math.cos(x),csc:x=>1/Math.sin(x),cot:x=>1/Math.tan(x),
  sinc:x=>x===0?1:Math.sin(x)/x,heaviside:x=>x<0?0:1,H:x=>x<0?0:1,erf:x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y},
  gamma:x=>{if(x<.5)return Math.PI/(Math.sin(Math.PI*x)*FNS.gamma(1-x));x-=1;const g=7,c=[.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];let a=c[0];const t=x+g+.5;for(let i=1;i<9;i++)a+=c[i]/(x+i);return Math.sqrt(2*Math.PI)*Math.pow(t,x+.5)*Math.exp(-t)*a},

const CONSTS={pi:Math.PI,e:Math.E,tau:2*Math.PI,inf:Infinity};
function compileExpr(src){
  src=String(src).replace(/\\(?=[a-zA-Z])/g,'').replace(/\\cdot|·|×/g,'*').replace(/−/g,'-').replace(/\*\*/g,'^').replace(/\\left|\\right/g,'').replace(/[{}]/g,m=>m==='{'?'(':')').replace(/π/g,'pi');
  const tk=[];const re=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+(?:[eE][+-]?\d+)?)|([A-Za-z_][A-Za-z_0-9]*)|(\S))/y;let m;
  while(re.lastIndex<src.length&&(m=re.exec(src))){if(m[1])tk.push({t:'n',v:parseFloat(m[1])});else if(m[2])tk.push({t:'i',v:m[2]});else if(m[3])tk.push({t:'o',v:m[3]})}
  let p=0;const peek=()=>tk[p],next=()=>tk[p++];
  const isStart=t=>t&&(t.t==='n'||t.t==='i'||(t.t==='o'&&t.v==='('));
  function expr(){let a=term();while(peek()&&peek().t==='o'&&(peek().v==='+'||peek().v==='-')){const op=next().v,b=term(),A=a;a=op==='+'?x=>A(x)+b(x):x=>A(x)-b(x)}return a}
  function term(){let a=unary();for(;;){const t=peek();if(t&&t.t==='o'&&(t.v==='*'||t.v==='/')){next();const b=unary(),A=a;a=t.v==='*'?x=>A(x)*b(x):x=>A(x)/b(x)}
    else if(isStart(t)){const b=unary(),A=a;a=x=>A(x)*b(x)}else break}return a}
  function unary(){const t=peek();if(t&&t.t==='o'&&(t.v==='-'||t.v==='+')){next();const a=unary();return t.v==='-'?x=>-a(x):a}return power()}
  function power(){const a=atom();const t=peek();if(t&&t.t==='o'&&t.v==='^'){next();const b=unary();return x=>Math.pow(a(x),b(x))}
    if(t&&t.t==='o'&&t.v==='!'){next();return x=>FNS.gamma(a(x)+1)}return a}
  function args(){const out=[expr()];while(peek()&&peek().v===','){next();out.push(expr())}return out}
  function atom(){const t=next();if(!t)throw new Error('expressão incompleta');
    if(t.t==='n'){const v=t.v;return()=>v}
    if(t.t==='o'&&t.v==='('){const a=expr();const c=next();if(!c||c.v!==')')throw new Error('falta fechar parêntese');return a}
    if(t.t==='o'&&t.v==='|'){const a=expr();const c=next();if(!c||c.v!=='|')throw new Error('falta fechar |…|');return x=>Math.abs(a(x))}
    if(t.t==='i'){const name=t.v;
      if(name==='x')return x=>x;
      if(FNS[name]){const f=FNS[name];
        if(peek()&&peek().v==='('){next();const as=args();const c=next();if(!c||c.v!==')')throw new Error('falta fechar parêntese em '+name);return x=>f(...as.map(g=>g(x)))}
        if(peek()&&peek().t==='o'&&peek().v==='^'){next();const ex=unary();const a=unary();return x=>Math.pow(f(a(x)),ex(x))}
        const a=unary();return x=>f(a(x))}
      if(name in CONSTS){const v=CONSTS[name];return()=>v}
      throw new Error('não reconheço "'+name+'"')}
    throw new Error('símbolo inesperado "'+t.v+'"')}
  const f=expr();if(p<tk.length)throw new Error('sobrou "'+tk[p].v+'"');return f;
}

let planCache=null,planSig='';
function invalidatePlan(){planCache=null}
function readingOrder(s){return s.els.slice().sort((a,b)=>(bb(a).y-bb(b).y)||(bb(a).x-bb(b).x))}
const CITE_RE=/\\cite[pt]?\{([^}]*)\}/g;
function computePlan(){
  const cites=[],seen=new Set(),labels={},segs={};let eq=0;const auto=!!deck.theme.eqAuto;
  const scan=(html,key)=>{
    if(!html)return;
    html.replace(CITE_RE,(m,ks)=>{ks.split(',').map(k=>k.trim()).filter(Boolean).forEach(k=>{if(!seen.has(k)){seen.add(k);cites.push(k)}});return m});
    const arr=[];
    html.replace(MATH_RE,m=>{const disp=m.startsWith('$$')||m.startsWith('\\[');if(!disp)return m;
      const labs=[...m.matchAll(/\\label\{([^}]+)\}/g)].map(x=>x[1]);
      if(labs.length)arr.push({nums:labs.map(l=>{eq++;labels[l]=eq;return eq})});
      else if(auto&&!/\\(notag|nonumber|tag)\b/.test(m)){eq++;arr.push({auto:eq})}
      else arr.push(null);
      return m});
    segs[key]=arr;
  };
  deck.slides.forEach(s=>readingOrder(s).forEach(e=>{if(e.type==='box'&&e.role!=='refs'&&e.role!=='toc')scan(e.html,e.id);else if(e.type==='table')e.cells.forEach((row,r)=>row.forEach((c,cc)=>{if(!c.hide)scan(c.html,e.id+':'+r+':'+cc)}))}));
  const nums={};cites.forEach((k,i)=>{nums[k]=i+1});
  return{cites:cites,nums:nums,labels:labels,segs:segs};
}
function plan(){if(!planCache)planCache=computePlan();return planCache}
function xform(html,key){
  if(!html||html.indexOf('\\')<0)return html;

  let out=html.replace(MATH_RE,m=>{const disp=m.startsWith('$$')||m.startsWith('\\[');if(!disp)return m;const sg=seg[si++];if(!sg)return m.replace(/\\label\{[^}]*\}/g,'');

  out=out.replace(CITE_RE,(m,ks)=>'['+ks.split(',').map(k=>k.trim()).filter(Boolean).map(k=>pl.nums[k]||'?').join(', ')+']');

}

function parseBibtex(src){
  const out=[];src=String(src);let i=0;
  while((i=src.indexOf('@',i))>=0){
    const m=/^@(\w+)\s*\{\s*([^,\s]+)\s*,/.exec(src.slice(i));if(!m){i++;continue}
    const open=i+m[0].indexOf('{');let depth=0,end=src.length;
    for(let k=open;k<src.length;k++){const ch=src[k];if(ch==='{')depth++;else if(ch==='}'){depth--;if(depth===0){end=k;break}}}
    const body=src.slice(i+m[0].length,end),f={};let p=0;
    while(p<body.length){const fm=/\s*([\w-]+)\s*=\s*/y;fm.lastIndex=p;const r=fm.exec(body);if(!r)break;p=fm.lastIndex;let val='';
      if(body[p]==='{'){let d=0,q=p;for(;q<body.length;q++){if(body[q]==='{')d++;else if(body[q]==='}'){d--;if(d===0)break}}val=body.slice(p+1,q);p=q+1}
      else if(body[p]==='"'){let q=p+1;while(q<body.length&&body[q]!=='"')q++;val=body.slice(p+1,q);p=q+1}
      else{const q=/[^,]*/y;q.lastIndex=p;val=q.exec(body)[0].trim();p=q.lastIndex}
      f[r[1].toLowerCase()]=val.replace(/\\["'`^~]\{?([a-zA-Z])\}?/g,'$1').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
      const c=/\s*,?/y;c.lastIndex=p;c.exec(body);p=c.lastIndex}
    out.push({key:m[2],authors:f.author||f.editor||'',title:f.title||'',journal:f.journal||f.booktitle||'',volume:f.volume||'',pages:f.pages||'',year:f.year||'',arxiv:f.eprint||'',doi:f.doi||'',url:f.url||''});
    i=end+1;
  }
  return out;
}

async function inspireSearch(q){

  else if(/^(doi:)?10\.\d{4,}\//i.test(q))query='doi:'+q.replace(/^doi:/i,'');

  try{REC.cam=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}},audio:false});mountCam();updatePTools()}

async function startRecording(presenter){
  if(!standalone||!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){toast('A gravação funciona na versão local ou hospedada, no Chrome, Edge ou Firefox.');return}
  let disp=null,mic=null;
  try{disp=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'})}
  catch(e){toast(e.name==='NotAllowedError'?'Gravação cancelada.':'Não foi possível capturar a tela: '+e.message);return}
  try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('Sem microfone: o vídeo será gravado sem a sua voz.')}
  const ac=new AudioContext(),dest=ac.createMediaStreamDestination();[disp,mic].forEach(s=>{if(s&&s.getAudioTracks().length)ac.createMediaStreamSource(s).connect(dest)});
  const out=new MediaStream([...disp.getVideoTracks(),...dest.stream.getAudioTracks()]);
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(out,mime?{mimeType:mime,videoBitsPerSecond:4000000}:undefined);REC.chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
  rec.onstop=()=>{const type=(mime||'video/webm').split(';')[0];const blob=new Blob(REC.chunks,{type:type});[disp,mic].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));try{ac.close()}catch(e){}REC.rec=null;updatePTools();
    saveBlob(slug(deck.title)+'-gravacao.'+(type==='video/mp4'?'mp4':'webm'),blob)};
  disp.getVideoTracks()[0].addEventListener('ended',stopRecording);
  REC.rec=rec;rec.start(1000);startPres(cur,presenter);updatePTools();toast('Gravando. Ao encerrar a apresentação, o vídeo é salvo.');
}

function htmlRuns(html,e){

    if(n.tagName==='BR'){runs.push({text:'',options:Object.assign({},st,{breakLine:true})});return}
    Array.from(n.childNodes).forEach(c=>walk(c,s));};
  const blocks=(root,lvl,ordered)=>{Array.from(root.children).forEach(b=>{
    if(b.tagName==='UL'||b.tagName==='OL'){Array.from(b.children).forEach(li=>{const sub=Array.from(li.children).filter(x=>x.tagName==='UL'||x.tagName==='OL');sub.forEach(x=>x.remove());
        const start=runs.length;walk(li,{});if(runs.length===start)runs.push({text:'',options:{}});runs[start].options=Object.assign({},runs[start].options,{bullet:b.tagName==='OL'?{type:'number'}:true,indentLevel:lvl});
        runs[runs.length-1].options.breakLine=true;sub.forEach(x=>blocks({children:[x]},lvl+1))})}
    else{const start=runs.length;walk(b,{});if(runs.length===start)runs.push({text:'',options:{}});runs[runs.length-1].options.breakLine=true}})};
  blocks(d,0);if(runs.length)delete runs[runs.length-1].options.breakLine;return runs;

/* ================= TikZ via TikZJax (TeX compiled to WebAssembly, runs in the browser) ================= */
const TIKZ_VER='1.0.0-beta24';
const TIKZ_NATIVE={pgfplots:'Gráficos de funções e dados (pgfplots)','tikz-cd':'Diagramas comutativos','tikz-3dplot':'Desenhos em 3D',amsmath:'amsmath (dentro dos rótulos)',amssymb:'amssymb',array:'array','hf-tikz':'Destaques em fórmulas (hf-tikz)'};
const TIKZ_EXTRA={'tikz-feynman':'Diagramas de Feynman (tikz-feynman)'};
function tikzBase(){if(window.__TIKZ_BASE)return window.__TIKZ_BASE;return standalone?'https://cdn.jsdelivr.net/npm/@drgrice1/tikzjax@'+TIKZ_VER+'/dist/':new URL('tikzjax/',location.href).href}
let tikzLoaded=null;
function loadTikz(){
  if(!tikzLoaded)tikzLoaded=new Promise((ok,no)=>{const s=document.createElement('script');s.src=tikzBase()+'tikzjax.js';
    s.onload=()=>ok();s.onerror=()=>{tikzLoaded=null;no(new Error(standalone?'não consegui baixar o TikZJax (verifique a internet)':'o TikZJax não pode ser carregado aqui no Claude; use a versão local ou hospedada'))};document.head.appendChild(s)});
  return tikzLoaded;

let tikzChain=Promise.resolve();
function texError(logs){
  const L=logs.join('\n').split('\n');const i=L.findIndex(l=>/^!/.test(l.trim()));if(i<0)return '';
  const msg=L[i].trim().replace(/^!\s*/,''),ln=L.slice(i,i+8).find(l=>/^l\.\d+/.test(l.trim()));
  return msg+(ln?' (linha '+ln.trim().match(/^l\.(\d+)/)[1]+': '+ln.trim().replace(/^l\.\d+\s*/,'').slice(0,60)+')':'');
}
function compileTikz(code,o){
  const run=()=>loadTikz().then(()=>new Promise((ok,no)=>{
    const host=$('#tikzHost'),logs=[],ol=console.log,oi=console.info;
    console.log=function(){logs.push(Array.from(arguments).join(' '))};console.info=console.log;
    const s=document.createElement('script');s.type='text/tikz';s.dataset.showConsole='true';
    if(o.libs)s.dataset.tikzLibraries=o.libs;if(o.pkgs&&Object.keys(o.pkgs).length)s.dataset.texPackages=JSON.stringify(o.pkgs);if(o.pre)s.dataset.addToPreamble=o.pre;

    const to=setTimeout(()=>fin(new Error('o TeX demorou demais (mais de 2 minutos)')),120000);
    const mo=new MutationObserver(()=>{const kids=Array.from(host.children);
      if(kids.some(k=>k.tagName==='IMG'))fin(new Error(texError(logs)||'erro de compilação no TeX'));
      else{const svg=kids.find(k=>k.tagName.toLowerCase()==='svg'&&!k.querySelector('animate'));if(svg)fin(null,svg)}});
    mo.observe(host,{childList:true,subtree:true});

  }));

}
function tikzPost(str){

  const pre='tk'+uid();svg.querySelectorAll('[id]').forEach(n=>{n.id=pre+n.id});

async function ensureTikzFonts(names){

function tikzOpts(e){

const tikzBusy=new Set();
